name: PR3 Validation Preview

on:
  push:
    branches:
      - refactor/datasource-option-rule-validation-consolidation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Apply exact repository Java format
        run: bash mvnw -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Apply exact repository frontend format
        working-directory: yak-ops-ui
        run: npm run format
      - name: Verify backend after formatting
        continue-on-error: true
        run: bash mvnw -pl '!yak-ops-ui,!yak-ops-dist' -Dspotless.check.skip=true verify
      - name: Verify frontend after formatting
        continue-on-error: true
        working-directory: yak-ops-ui
        run: npm run lint && npm run typecheck && npm run contract:check
      - name: Export formatter results
        if: always()
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "FORMATTED_FILE_PATH:$file"
            base64 -w 0 "$file"
            printf '\nFORMATTED_FILE_END\n'
          done < <(git diff --name-only -- '*.java' 'yak-ops-ui/**/*.ts' 'yak-ops-ui/**/*.tsx' 'yak-ops-ui/**/*.mjs')
