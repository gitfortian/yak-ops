name: Connector Refactor Workbench

on:
  push:
    branches:
      - refactor/connector-factory-datasource-access-simplification

permissions:
  contents: read

concurrency:
  group: connector-refactor-workbench
  cancel-in-progress: false

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format committed Java source
        run: |
          bash mvnw -B -ntp -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: format connector and datasource simplification'
            git push origin HEAD
          fi
      - name: Check logging rules
        run: python3 scripts/verify_logging_rules.py
      - name: Verify backend
        run: bash mvnw -B -ntp -pl '!yak-ops-ui,!yak-ops-dist' verify
      - name: Export formatted source
        if: always()
        run: git archive --format=zip HEAD -o /tmp/connector-refactor-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-refactor-source
          path: /tmp/connector-refactor-source.zip
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-refactor-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 2
