name: Connector Refactor Workbench

on:
  push:
    branches:
      - refactor/connector-factory-datasource-access-simplification

permissions:
  contents: read

concurrency:
  group: connector-refactor-workbench
  cancel-in-progress: false

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate reviewed main changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          main=0d386da5fa3be4c15210d1aab4179550cd43f4da
          if ! git merge-base --is-ancestor "$main" HEAD; then
            git merge --no-commit --no-ff "$main" || test "$(git diff --name-only --diff-filter=U | wc -l)" -eq 2
            python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          prefix = 'yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync/src/'
          conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          expected = {
              prefix + 'test/java/io/yak/ops/plugin/task/datasync/DataSyncExecutionTest.java': 1,
              prefix + 'test/java/io/yak/ops/plugin/task/datasync/config/ExecutionConfigurationFactoryTest.java': 3,
          }
          if conflicts != set(expected):
              raise SystemExit('Unexpected merge conflicts; refusing automatic resolution')
          for name, count in expected.items():
              path = Path(name)
              text, replaced = re.subn(r'<<<<<<< HEAD\n.*?=======\n(.*?)>>>>>>> [^\n]+\n', r'\1', path.read_text(), flags=re.S)
              if replaced != count:
                  raise SystemExit('Unexpected conflict shape: ' + name)
              path.write_text(text)
          path = Path(prefix + 'test/java/io/yak/ops/plugin/task/datasync/plan/MySqlCdcReplicationIdentityTest.java')
          text = path.read_text()
          text = text.replace('keepsServerIdAndTopicPrefixStableForOneInstanceAcrossAttempts', 'keepsServerIdAndTopicPrefixStableForRepeatedInstancePlanning')
          text = text.replace(', "attempt-1"', '').replace(', "attempt-2"', '')
          path.write_text(text)
          path = Path(prefix + 'main/java/io/yak/ops/plugin/task/datasync/pipeline/PipelineBuilder.java')
          path.write_text(path.read_text().replace('@param identity Task Instance and Attempt identity', '@param identity trusted Task Instance identity'))
          PY
            git add -u
            git diff --cached --check
            git commit -m 'merge: retain current Task Instance execution contract and align connector tests'
            git push origin HEAD:refactor/connector-factory-datasource-access-simplification
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format committed Java source
        run: |
          bash mvnw -B -ntp -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: format connector and datasource simplification'
            git push origin HEAD:refactor/connector-factory-datasource-access-simplification
          fi
      - name: Check logging rules
        run: python3 scripts/verify_logging_rules.py
      - name: Verify backend
        run: bash mvnw -B -ntp -pl '!yak-ops-ui,!yak-ops-dist' verify
      - name: Export formatted source
        if: always()
        run: |
          mkdir -p /tmp/connector-review
          git archive --format=tar HEAD -o /tmp/connector-review/head.tar
          git archive --format=tar origin/main -o /tmp/connector-review/main.tar
          git rev-parse HEAD origin/main > /tmp/connector-review/revisions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-review-snapshots
          path: /tmp/connector-review/
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-refactor-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 2
