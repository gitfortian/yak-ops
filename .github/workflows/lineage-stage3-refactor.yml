name: Lineage Stage 3 Refactor

on:
  push:
    branches:
      - refactor/lineage-stage3-service-facades

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply service-facade refactor
        shell: bash
        run: |
          mkdir -p .github/scripts
          cat > /tmp/lineage-stage3-refactor.py.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/lineage-stage3-refactor.py.gz.b64 | gzip -d > .github/scripts/lineage_stage3_refactor.py
          python .github/scripts/lineage_stage3_refactor.py
