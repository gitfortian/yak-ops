name: Vendor MySQL JDBC Drivers

on:
  push:
    branches:
      - feat/bundle-mysql-jdbc-drivers
    paths:
      - .github/workflows/vendor-mysql-jdbc-drivers.yml

permissions:
  contents: write

jobs:
  vendor:
    if: github.event.head_commit.message == 'chore: vendor MySQL JDBC drivers'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/bundle-mysql-jdbc-drivers

      - name: Download verified MySQL drivers
        shell: bash
        run: |
          set -euo pipefail

          MYSQL5_DIR="yak-ops-dist/src/main/jdbc-drivers-builtin/mysql/5"
          MYSQL8_DIR="yak-ops-dist/src/main/jdbc-drivers-builtin/mysql/8"
          MYSQL5_JAR="${MYSQL5_DIR}/mysql-connector-java-5.1.49.jar"
          MYSQL8_JAR="${MYSQL8_DIR}/mysql-connector-j-8.4.0.jar"

          mkdir -p "${MYSQL5_DIR}" "${MYSQL8_DIR}"

          curl --fail --location --retry 3             --output "${MYSQL5_JAR}"             "https://repo.maven.apache.org/maven2/mysql/mysql-connector-java/5.1.49/mysql-connector-java-5.1.49.jar"

          curl --fail --location --retry 3             --output "${MYSQL8_JAR}"             "https://repo.maven.apache.org/maven2/com/mysql/mysql-connector-j/8.4.0/mysql-connector-j-8.4.0.jar"

          echo "cf76d2e4c9c3782a85c15c87bec5772b34ffd0e5  ${MYSQL5_JAR}" | sha1sum --check -
          echo "b1bc0f47bcad26ad5f9bceefb63fcb920d868fca  ${MYSQL8_JAR}" | sha1sum --check -

      - name: Commit driver binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             yak-ops-dist/src/main/jdbc-drivers-builtin/mysql/5/mysql-connector-java-5.1.49.jar             yak-ops-dist/src/main/jdbc-drivers-builtin/mysql/8/mysql-connector-j-8.4.0.jar
          git commit -m "build(dist): bundle MySQL JDBC driver binaries"
          git push origin HEAD:feat/bundle-mysql-jdbc-drivers
