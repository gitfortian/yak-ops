name: Release Publish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Product version to publish.
        required: true
        default: "1.0.0"
        type: string
      release_commit:
        description: Exact commit that passed the formal Release Gate.
        required: true
        default: "4d146ab05894b47a63e89e0d27e0606abe803bed"
        type: string
      gate_run_id:
        description: Successful V1 Release Gate workflow run ID for this commit.
        required: true
        default: "36513582550"
        type: string
      publish_latest:
        description: Update latest only after immutable images and GitHub Release succeed.
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release-publish-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Tag + GitHub Release + Docker Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      GATE_RUN_ID: ${{ inputs.gate_run_id }}
      PUBLISH_LATEST: ${{ inputs.publish_latest }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify formal Release Gate
        shell: bash
        run: |
          set -euo pipefail

          run_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}" --jq '.name')"
          run_event="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}" --jq '.event')"
          run_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}" --jq '.status')"
          run_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}" --jq '.conclusion')"
          run_branch="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}" --jq '.head_branch')"
          run_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}" --jq '.head_sha')"
          release_decision="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "V1 Release Decision") | .conclusion' | tail -n 1)"

          test "${run_name}" = "V1 Release Gate"
          test "${run_event}" = "workflow_dispatch"
          test "${run_status}" = "completed"
          test "${run_conclusion}" = "success"
          test "${run_branch}" = "main"
          test "${run_sha}" = "${RELEASE_COMMIT}"
          test "${release_decision}" = "success"

          echo "Formal V1 Release Gate verified: run=${GATE_RUN_ID} commit=${RELEASE_COMMIT}"

      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/check-release-metadata.sh "v${RELEASE_VERSION}"
          test -f "docs/release/v${RELEASE_VERSION}-release-notes.md"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"

      - name: Download formal Gate artifact
        uses: actions/download-artifact@v4
        with:
          name: yak-ops-${{ inputs.release_version }}-release-candidate
          path: release-candidate
          run-id: ${{ inputs.gate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate distribution
        shell: bash
        run: |
          set -euo pipefail

          archive="yak-ops-${RELEASE_VERSION}.tar.gz"
          test -f "release-candidate/${archive}"
          test -f release-candidate/SHA256SUMS

          (
            cd release-candidate
            sha256sum -c SHA256SUMS
          )

          rm -rf yak-ops-dist/target
          mkdir -p yak-ops-dist/target
          cp "release-candidate/${archive}" yak-ops-dist/target/
          cp release-candidate/SHA256SUMS yak-ops-dist/target/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Docker Hub namespace
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          source release.env
          test -n "${DOCKERHUB_USERNAME}"
          test "${DOCKERHUB_USERNAME}" = "${DOCKERHUB_NAMESPACE}"

      - name: Inspect existing immutable release state
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          tag="v${RELEASE_VERSION}"
          short_sha="$(git rev-parse --short HEAD)"
          backend_image="${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"
          frontend_image="${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            existing_tag_commit="$(git rev-list -n 1 "${tag}")"
            test "${existing_tag_commit}" = "${RELEASE_COMMIT}"
            echo "TAG_EXISTS=true" >> "${GITHUB_ENV}"
            echo "Existing tag points to the expected release commit."
          else
            echo "TAG_EXISTS=false" >> "${GITHUB_ENV}"
          fi

          check_image() {
            local image="$1"
            local env_name="$2"

            if docker pull "${image}" >/dev/null 2>&1; then
              local version revision
              version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
              test "${version}" = "${RELEASE_VERSION}"
              test "${revision}" = "${short_sha}"
              echo "${env_name}=true" >> "${GITHUB_ENV}"
              echo "Existing immutable image verified: ${image}"
            else
              echo "${env_name}=false" >> "${GITHUB_ENV}"
            fi
          }

          check_image "${backend_image}" BACKEND_IMAGE_EXISTS
          check_image "${frontend_image}" FRONTEND_IMAGE_EXISTS

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "${GITHUB_ENV}"
            echo "Existing GitHub Release detected; it will be verified instead of overwritten."
          else
            echo "RELEASE_EXISTS=false" >> "${GITHUB_ENV}"
          fi

      - name: Build release images from formal Gate distribution
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          short_sha="$(git rev-parse --short HEAD)"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          backend_image="${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"
          frontend_image="${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"

          docker build \
            --pull \
            --target backend-runtime \
            --build-arg "VERSION=${RELEASE_VERSION}" \
            --build-arg "VCS_REF=${short_sha}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --tag "${backend_image}" \
            .

          docker build \
            --pull \
            --target frontend-runtime \
            --build-arg "VERSION=${RELEASE_VERSION}" \
            --build-arg "VCS_REF=${short_sha}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --tag "${frontend_image}" \
            .

      - name: Smoke locally built release images
        shell: bash
        run: bash scripts/release/smoke-compose.sh "v${RELEASE_VERSION}"

      - name: Push immutable Docker tags
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          backend_image="${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"
          frontend_image="${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"

          if [[ "${BACKEND_IMAGE_EXISTS}" != "true" ]]; then
            docker push "${backend_image}"
          else
            echo "Skip existing immutable image: ${backend_image}"
          fi

          if [[ "${FRONTEND_IMAGE_EXISTS}" != "true" ]]; then
            docker push "${frontend_image}"
          else
            echo "Skip existing immutable image: ${frontend_image}"
          fi

      - name: Pull immutable tags back from Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          backend_image="${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"
          frontend_image="${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"

          docker image rm "${backend_image}" "${frontend_image}" >/dev/null 2>&1 || true
          docker pull "${backend_image}"
          docker pull "${frontend_image}"

      - name: Verify registry image identity
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          short_sha="$(git rev-parse --short HEAD)"
          for image in \
            "${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}" \
            "${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"; do
            version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
            test "${version}" = "${RELEASE_VERSION}"
            test "${revision}" = "${short_sha}"
            echo "OK  ${image} version=${version} revision=${revision}"
          done

      - name: Smoke images pulled from Docker Hub
        shell: bash
        run: bash scripts/release/smoke-compose.sh "v${RELEASE_VERSION}"

      - name: Resolve registry digests
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          backend_repository="${DOCKERHUB_NAMESPACE}/yak-ops-api"
          frontend_repository="${DOCKERHUB_NAMESPACE}/yak-ops"
          backend_image="${backend_repository}:${RELEASE_VERSION}"
          frontend_image="${frontend_repository}:${RELEASE_VERSION}"

          backend_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${backend_image}" | grep "^${backend_repository}@sha256:" | head -n 1 | cut -d@ -f2)"
          frontend_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${frontend_image}" | grep "^${frontend_repository}@sha256:" | head -n 1 | cut -d@ -f2)"

          test -n "${backend_digest}"
          test -n "${frontend_digest}"

          echo "BACKEND_REGISTRY_DIGEST=${backend_digest}" >> "${GITHUB_ENV}"
          echo "FRONTEND_REGISTRY_DIGEST=${frontend_digest}" >> "${GITHUB_ENV}"

          echo "Backend registry digest: ${backend_digest}"
          echo "Frontend registry digest: ${frontend_digest}"

      - name: Create immutable Git tag
        if: env.TAG_EXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag="v${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${RELEASE_COMMIT}" -m "Yak Ops ${tag}"
          git push origin "${tag}"

      - name: Verify immutable Git tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git rev-list -n 1 "${tag}")" = "${RELEASE_COMMIT}"

      - name: Build final release evidence
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          archive="yak-ops-${RELEASE_VERSION}.tar.gz"
          distribution_sha="$(awk -v file="${archive}" '$2 == file {print $1}' release-candidate/SHA256SUMS)"
          test -n "${distribution_sha}"

          evidence="release-evidence-v${RELEASE_VERSION}.md"
          cat > "${evidence}" <<EOF
# Yak Ops v${RELEASE_VERSION} Release Evidence

- Product Version: ${RELEASE_VERSION}
- Git Tag: v${RELEASE_VERSION}
- Release Commit: ${RELEASE_COMMIT}
- Formal Release Gate: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}
- Distribution: ${archive}
- Distribution SHA-256: ${distribution_sha}
- Backend Image: ${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}
- Backend Registry Digest: ${BACKEND_REGISTRY_DIGEST}
- Frontend Image: ${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}
- Frontend Registry Digest: ${FRONTEND_REGISTRY_DIGEST}
- Required Manual E2E: PASS
- Flyway Baseline Review: PASS
- Release Blocker Review: PASS
- Quality Gate: PASS
- Full Backend Acceptance: PASS
- Distribution Verification: PASS
- Registry Image Identity: PASS
- Registry Image Compose Smoke: PASS
EOF

          cat "${evidence}"

      - name: Create GitHub Release
        if: env.RELEASE_EXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag="v${RELEASE_VERSION}"
          notes="docs/release/v${RELEASE_VERSION}-release-notes.md"
          evidence="release-evidence-v${RELEASE_VERSION}.md"

          gh release create "${tag}" \
            "release-candidate/yak-ops-${RELEASE_VERSION}.tar.gz" \
            "release-candidate/SHA256SUMS" \
            "${evidence}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Yak Ops ${tag}" \
            --notes-file "${notes}"

      - name: Verify GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"

          test "$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq '.isPrerelease')" = "false"

          assets="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          grep -Fxq "yak-ops-${RELEASE_VERSION}.tar.gz" <<< "${assets}"
          grep -Fxq "SHA256SUMS" <<< "${assets}"
          grep -Fxq "release-evidence-v${RELEASE_VERSION}.md" <<< "${assets}"

      - name: Update latest Docker tags
        if: inputs.publish_latest
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          backend_repository="${DOCKERHUB_NAMESPACE}/yak-ops-api"
          frontend_repository="${DOCKERHUB_NAMESPACE}/yak-ops"

          docker tag "${backend_repository}:${RELEASE_VERSION}" "${backend_repository}:latest"
          docker tag "${frontend_repository}:${RELEASE_VERSION}" "${frontend_repository}:latest"
          docker push "${backend_repository}:latest"
          docker push "${frontend_repository}:latest"

      - name: Final publish summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Yak Ops v${RELEASE_VERSION} published successfully."
          echo "Release commit: ${RELEASE_COMMIT}"
          echo "Backend digest: ${BACKEND_REGISTRY_DIGEST}"
          echo "Frontend digest: ${FRONTEND_REGISTRY_DIGEST}"
          echo "GitHub Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}"

      - name: Upload final release evidence
        uses: actions/upload-artifact@v4
        with:
          name: yak-ops-${{ inputs.release_version }}-published-evidence
          path: release-evidence-v${{ inputs.release_version }}.md
          if-no-files-found: error
          retention-days: 90
