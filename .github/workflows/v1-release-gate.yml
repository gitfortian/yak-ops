name: V1 Release Gate

on:
  pull_request:
    paths:
      - ".github/workflows/v1-release-gate.yml"
      - ".github/workflows/quality-check.yml"
      - ".github/workflows/backend-acceptance.yml"
      - "scripts/release/**"
      - "yak-ops-dist/**"
      - "Dockerfile"
      - "docker/**"
      - "compose.yaml"
      - "compose.without-mysql.yaml"
      - "release.env"
      - ".env.example"
      - "pom.xml"
      - "yak-ops-ui/package.json"
      - "yak-ops-ui/package-lock.json"
  workflow_dispatch:
    inputs:
      release_version:
        description: Product version to validate.
        required: true
        default: "1.0.0"
        type: string
      manual_e2e_confirmed:
        description: Required V1 Manual E2E scenarios have passed.
        required: true
        default: false
        type: boolean
      baseline_review_confirmed:
        description: V1 Flyway baseline has completed final review and is ready to freeze.
        required: true
        default: false
        type: boolean
      blockers_cleared:
        description: No open P0/P1 release blocker remains.
        required: true
        default: false
        type: boolean
      release_notes_confirmed:
        description: Release notes and known limitations are ready.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v1-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/quality-check.yml

  backend-acceptance:
    name: Full Backend Acceptance
    uses: ./.github/workflows/backend-acceptance.yml
    with:
      full_sweep: true

  package-smoke:
    name: Distribution + Docker + Compose Smoke
    needs:
      - quality
      - backend-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '1.0.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json

      - name: Verify release metadata
        run: bash scripts/release/check-release-metadata.sh "v${RELEASE_VERSION}"

      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend
        working-directory: yak-ops-ui
        run: npm run build

      - name: Build distribution
        run: bash mvnw -B -ntp -DskipTests package

      - name: Verify distribution
        run: bash scripts/release/verify-distribution.sh "v${RELEASE_VERSION}"

      - name: Resolve build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "VCS_REF=$(git rev-parse --short HEAD)" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Build backend image
        shell: bash
        run: |
          set -euo pipefail
          source release.env
          docker build             --pull             --target backend-runtime             --build-arg "VERSION=${RELEASE_VERSION}"             --build-arg "VCS_REF=${VCS_REF}"             --build-arg "BUILD_DATE=${BUILD_DATE}"             --tag "${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"             .

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail
          source release.env
          docker build             --pull             --target frontend-runtime             --build-arg "VERSION=${RELEASE_VERSION}"             --build-arg "VCS_REF=${VCS_REF}"             --build-arg "BUILD_DATE=${BUILD_DATE}"             --tag "${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"             .

      - name: Verify image identity
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          for image in             "${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"             "${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"; do
            version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"

            test "${version}" = "${RELEASE_VERSION}"
            test "${revision}" = "${VCS_REF}"

            echo "OK  ${image} version=${version} revision=${revision}"
          done

      - name: Compose login smoke
        run: bash scripts/release/smoke-compose.sh "v${RELEASE_VERSION}"

      - name: Build release candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          mkdir -p release-evidence

          archive="yak-ops-${RELEASE_VERSION}.tar.gz"
          cp "yak-ops-dist/target/${archive}" release-evidence/
          cp yak-ops-dist/target/SHA256SUMS release-evidence/

          distribution_sha="$(awk -v file="${archive}" '$2 == file {print $1}' yak-ops-dist/target/SHA256SUMS)"
          backend_image="${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"
          frontend_image="${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"
          backend_id="$(docker image inspect --format '{{.Id}}' "${backend_image}")"
          frontend_id="$(docker image inspect --format '{{.Id}}' "${frontend_image}")"
          commit_sha="$(git rev-parse HEAD)"

          cat > release-evidence/release-evidence.md <<EOF
          # Yak Ops ${RELEASE_VERSION} Release Candidate Evidence

          - Product Version: `${RELEASE_VERSION}`
          - Candidate Commit: `${commit_sha}`
          - Workflow Run: `https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`
          - Distribution: `${archive}`
          - Distribution SHA-256: `${distribution_sha}`
          - Backend Image: `${backend_image}`
          - Backend Local Image ID: `${backend_id}`
          - Frontend Image: `${frontend_image}`
          - Frontend Local Image ID: `${frontend_id}`
          - Quality Gate: PASS
          - Full Backend Acceptance: PASS
          - Distribution Verification: PASS
          - Docker Image Identity: PASS
          - Compose Login Smoke: PASS

          Local image IDs are candidate-build evidence. Registry manifest digests are recorded only after immutable version tags are pushed during the publish step.
          EOF

          cat release-evidence/release-evidence.md

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: yak-ops-${{ env.RELEASE_VERSION }}-release-candidate
          path: release-evidence/
          if-no-files-found: error
          retention-days: 14

  automated-release-gate:
    name: Automated Release Gate
    if: always()
    needs:
      - quality
      - backend-acceptance
      - package-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Verify automated release results
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          ACCEPTANCE_RESULT: ${{ needs.backend-acceptance.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          set -euo pipefail

          for result in "${QUALITY_RESULT}" "${ACCEPTANCE_RESULT}" "${PACKAGE_SMOKE_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Automated release gate failed: ${result}"
              exit 1
            fi
          done

          echo "V1 automated release gate passed."

  release-decision:
    name: V1 Release Decision
    if: github.event_name == 'workflow_dispatch'
    needs:
      - automated-release-gate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      MANUAL_E2E_CONFIRMED: ${{ inputs.manual_e2e_confirmed }}
      BASELINE_REVIEW_CONFIRMED: ${{ inputs.baseline_review_confirmed }}
      BLOCKERS_CLEARED: ${{ inputs.blockers_cleared }}
      RELEASE_NOTES_CONFIRMED: ${{ inputs.release_notes_confirmed }}

    steps:
      - name: Verify release readiness confirmations
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Formal V1 release decision must run from main, current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          for value in             "${MANUAL_E2E_CONFIRMED}"             "${BASELINE_REVIEW_CONFIRMED}"             "${BLOCKERS_CLEARED}"             "${RELEASE_NOTES_CONFIRMED}"; do
            if [[ "${value}" != "true" ]]; then
              echo "A required human release confirmation is missing."
              exit 1
            fi
          done

          echo "Yak Ops v${RELEASE_VERSION} release gate PASS."
          echo "This workflow does not create a Git tag or publish images."
