name: Temporary Chunk Startup Spotless Apply
on:
  push:
    branches:
      - feat/mysql-cdc-chunk-startup-completion
    paths:
      - .github/workflows/temporary-chunk-startup-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'weifuwan/yak-ops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: feat/mysql-cdc-chunk-startup-completion
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply official Java formatter for MySQL CDC
        run: bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Commit formatter-only changes
        run: |
          set -euo pipefail
          git add yak-flow/yak-flow-connector-cdc-mysql/src/main/java
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(cdc): format historical Schema History bootstrap'
            git push origin HEAD:refs/heads/feat/mysql-cdc-chunk-startup-completion
          fi
