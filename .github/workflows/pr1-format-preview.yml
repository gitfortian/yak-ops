name: PR1 Format Preview

on:
  push:
    branches:
      - refactor/seatunnel-configuration-foundation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format changed Java files
        run: bash mvnw -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Export formatted Java sources for review
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "FORMATTED_FILE_PATH:$file"
            base64 -w 0 "$file"
            printf '\nFORMATTED_FILE_END\n'
          done < <(git diff --name-only -- '*.java')
