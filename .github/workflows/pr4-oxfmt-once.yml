name: PR4 Oxfmt Once

on:
  push:
    branches:
      - refactor/data-sync-detail-execution-log

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Format frontend code
        working-directory: yak-ops-ui
        run: npm run format
      - name: Commit one-time formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yak-ops-ui/apps yak-ops-ui/scripts
          if ! git diff --cached --quiet; then
            git commit -m "style(frontend): format Data Sync detail refactor"
            git push origin HEAD:refs/heads/refactor/data-sync-detail-execution-log
          fi
