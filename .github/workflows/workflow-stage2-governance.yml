name: Workflow Stage 2 Governance

on:
  push:
    branches:
      - refactor/workflow-stage2-governance

permissions:
  contents: write

jobs:
  governance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply workflow governance contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          ROOT = Path("yak-ops-business/yak-ops-business-workflow")
          JAVA = ROOT / "src/main/java/io/yak/ops/business/workflow"
          TEST = ROOT / "src/test/java/io/yak/ops/business/workflow"

          def read(path):
              return path.read_text(encoding="utf-8")

          def write(path, content):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          def replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise RuntimeError(f"expected text not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, count)
              write(path, text)

          # ------------------------------------------------------------------
          # Final consistency: remove package cycles left by the structural cutover.
          # ------------------------------------------------------------------

          # Definition -> Schedule cycle: schedule activation is a schedule-owned guard.
          src = JAVA / "definition/WorkflowDefinitionScheduleGuard.java"
          dst = JAVA / "schedule/WorkflowDefinitionScheduleGuard.java"
          text = read(src)
          text = text.replace(
              "package io.yak.ops.business.workflow.definition;\n\n"
              "import io.yak.ops.business.workflow.schedule.WorkflowScheduleLifecycle;\n\n",
              "package io.yak.ops.business.workflow.schedule;\n\n")
          write(dst, text)
          src.unlink()
          replace(
              JAVA / "controller/v1/WorkflowDefinitionController.java",
              "import io.yak.ops.business.workflow.definition.WorkflowDefinitionScheduleGuard;",
              "import io.yak.ops.business.workflow.schedule.WorkflowDefinitionScheduleGuard;")

          test_src = TEST / "definition/WorkflowDefinitionScheduleGuardTest.java"
          test_dst = TEST / "schedule/WorkflowDefinitionScheduleGuardTest.java"
          text = read(test_src)
          text = text.replace(
              "package io.yak.ops.business.workflow.definition;\n\n"
              "import io.yak.ops.business.workflow.schedule.WorkflowScheduleLifecycle;\n\n",
              "package io.yak.ops.business.workflow.schedule;\n\n")
          write(test_dst, text)
          test_src.unlink()

          # Execution owns the in-place reactivation port; Trigger Ledger supplies the policy.
          write(
              JAVA / "execution/WorkflowExecutionReactivationGuard.java",
              '''package io.yak.ops.business.workflow.execution;

          import io.yak.ops.common.bean.vo.workflow.WorkflowInstanceVO;
          import java.util.function.Supplier;

          /** Narrow guard applied before an existing WorkflowExecution is reactivated in place. */
          public interface WorkflowExecutionReactivationGuard {

            WorkflowInstanceVO reactivateExecution(
                String executionId,
                String operation,
                Supplier<WorkflowInstanceVO> action);
          }
          '''.replace("          ", ""))

          path = JAVA / "execution/WorkflowExecutionReactivator.java"
          text = read(path)
          text = text.replace(
              "import io.yak.ops.business.workflow.runtime.WorkflowRuntime;\n"
              "import io.yak.ops.business.workflow.schedule.trigger.WorkflowScheduleTriggerCoordinator;\n",
              "import io.yak.ops.business.workflow.runtime.WorkflowRuntime;\n")
          text = text.replace(
              "ObjectProvider<WorkflowScheduleTriggerCoordinator>",
              "ObjectProvider<WorkflowExecutionReactivationGuard>")
          text = text.replace(
              "WorkflowScheduleTriggerCoordinator value = coordinator.getIfAvailable();",
              "WorkflowExecutionReactivationGuard value = coordinator.getIfAvailable();")
          write(path, text)

          path = TEST / "execution/WorkflowExecutionReactivatorTest.java"
          text = read(path)
          text = text.replace(
              "import io.yak.ops.business.workflow.runtime.WorkflowRuntime;\n"
              "import io.yak.ops.business.workflow.schedule.trigger.WorkflowScheduleTriggerCoordinator;\n",
              "import io.yak.ops.business.workflow.runtime.WorkflowRuntime;\n")
          text = text.replace(
              "ObjectProvider<WorkflowScheduleTriggerCoordinator>",
              "ObjectProvider<WorkflowExecutionReactivationGuard>")
          text = text.replace(
              "WorkflowScheduleTriggerCoordinator coordinator;",
              "WorkflowExecutionReactivationGuard coordinator;")
          write(path, text)

          # Execution owns the business-date rerun use-case port; Backfill implements it.
          write(
              JAVA / "execution/WorkflowBusinessDateRerunGateway.java",
              '''package io.yak.ops.business.workflow.execution;

          import io.yak.ops.common.bean.dto.workflow.WorkflowBusinessDateRerunDTO;
          import io.yak.ops.common.bean.vo.workflow.WorkflowBackfillVO;
          import io.yak.ops.common.bean.vo.workflow.WorkflowInstanceVO;

          /** Narrow execution-to-backfill port for operational business-date reruns. */
          public interface WorkflowBusinessDateRerunGateway {

            WorkflowBackfillVO createBusinessDateRerun(
                String sourceExecutionId,
                WorkflowInstanceVO source,
                WorkflowBusinessDateRerunDTO request);
          }
          '''.replace("          ", ""))

          path = JAVA / "execution/WorkflowExecutionManager.java"
          text = read(path)
          text = text.replace(
              "import io.yak.ops.business.workflow.backfill.WorkflowBackfillManager;\n",
              "")
          text = text.replace(
              "/** Stage 6 工作流实例运维编排：查询血缘、批量失败恢复和指定 businessDate 补跑。 */",
              "/** 工作流实例运维编排：查询血缘、批量失败恢复和指定 businessDate 补跑。 */")
          text = text.replace(
              "ObjectProvider<WorkflowBackfillManager>",
              "ObjectProvider<WorkflowBusinessDateRerunGateway>")
          text = text.replace(
              "WorkflowBackfillManager service = backfillService.getIfAvailable();",
              "WorkflowBusinessDateRerunGateway service = backfillService.getIfAvailable();")
          write(path, text)

          path = TEST / "execution/WorkflowExecutionManagerTest.java"
          text = read(path)
          text = text.replace(
              "import io.yak.ops.business.workflow.backfill.WorkflowBackfillManager;\n",
              "")
          text = text.replace(
              "ObjectProvider<WorkflowBackfillManager>",
              "ObjectProvider<WorkflowBusinessDateRerunGateway>")
          text = text.replace(
              "WorkflowBackfillManager backfillService;",
              "WorkflowBusinessDateRerunGateway backfillService;")
          write(path, text)

          # Schedule owns a small backfill-trigger port; the adapter keeps backfill details out of schedule.
          write(
              JAVA / "schedule/trigger/WorkflowBackfillTriggerGateway.java",
              '''package io.yak.ops.business.workflow.schedule.trigger;

          import io.yak.ops.common.bean.po.workflow.WorkflowScheduleTriggerPO;
          import io.yak.ops.common.bean.vo.workflow.WorkflowInstanceVO;
          import java.time.Instant;
          import java.time.LocalDate;

          /** Backfill-specific trigger creation and launch kept behind the Trigger Ledger boundary. */
          public interface WorkflowBackfillTriggerGateway {

            WorkflowScheduleTriggerPO createTrigger(
                String backfillId,
                LocalDate businessDate,
                Instant plannedFireTime);

            boolean runnable(String backfillId);

            WorkflowInstanceVO launch(WorkflowScheduleTriggerPO trigger);
          }
          '''.replace("          ", ""))

          write(
              JAVA / "backfill/WorkflowBackfillTriggerAdapter.java",
              '''package io.yak.ops.business.workflow.backfill;

          import io.yak.ops.business.workflow.domain.WorkflowScheduleTriggerIdentity;
          import io.yak.ops.business.workflow.domain.WorkflowTriggerContext;
          import io.yak.ops.business.workflow.execution.WorkflowLauncher;
          import io.yak.ops.business.workflow.schedule.WorkflowScheduleParameterResolver;
          import io.yak.ops.business.workflow.schedule.trigger.WorkflowBackfillTriggerGateway;
          import io.yak.ops.common.bean.po.workflow.WorkflowBackfillPO;
          import io.yak.ops.common.bean.po.workflow.WorkflowScheduleTriggerPO;
          import io.yak.ops.common.bean.vo.workflow.WorkflowInstanceVO;
          import java.time.Instant;
          import java.time.LocalDate;
          import java.util.Map;
          import java.util.UUID;
          import org.springframework.boot.autoconfigure.condition.ConditionalOnProperty;
          import org.springframework.stereotype.Component;

          /** Adapts a durable Backfill batch to the generic Trigger Ledger contract. */
          @Component
          @ConditionalOnProperty(
              prefix = "yak.database",
              name = "enabled",
              havingValue = "true",
              matchIfMissing = true)
          public class WorkflowBackfillTriggerAdapter implements WorkflowBackfillTriggerGateway {
            private static final String BUSINESS_DATE_RERUN = "BUSINESS_DATE_RERUN";

            private final WorkflowBackfillQuery backfills;
            private final WorkflowScheduleParameterResolver parameters;
            private final WorkflowLauncher launcher;

            public WorkflowBackfillTriggerAdapter(
                WorkflowBackfillQuery backfills,
                WorkflowScheduleParameterResolver parameters,
                WorkflowLauncher launcher) {
              this.backfills = backfills;
              this.parameters = parameters;
              this.launcher = launcher;
            }

            @Override
            public WorkflowScheduleTriggerPO createTrigger(
                String backfillId,
                LocalDate businessDate,
                Instant plannedFireTime) {
              if (businessDate == null || plannedFireTime == null) {
                throw new IllegalArgumentException("Backfill Trigger 缺少 businessDate / plannedFireTime");
              }
              WorkflowBackfillPO backfill = backfills.require(required(backfillId, "Backfill ID 不能为空"));
              Instant now = Instant.now();
              boolean operational = operational(backfill);

              WorkflowScheduleTriggerPO value = new WorkflowScheduleTriggerPO();
              value.setId("workflow-trigger-ledger-" + UUID.randomUUID());
              value.setScheduleId(backfill.getScheduleId());
              value.setWorkflowId(backfill.getWorkflowId());
              value.setBackfillId(backfill.getId());
              value.setTriggerId((operational ? "workflow-rerun-" : "workflow-backfill-")
                  + backfill.getId() + "-" + plannedFireTime.toEpochMilli());
              value.setDedupeKey(WorkflowScheduleTriggerIdentity.backfill(
                  backfill.getScheduleId(), backfill.getId(), plannedFireTime));
              value.setTriggerSource(operational ? BUSINESS_DATE_RERUN : "BACKFILL");
              value.setPlannedFireTime(plannedFireTime);
              value.setActualFireTime(now);
              value.setBusinessDate(businessDate);
              value.setExecutionStrategy(backfill.getExecutionStrategy());
              value.setMisfireStrategy("FIRE_ONCE");
              value.setStatus("RECEIVED");
              value.setCreateTime(now);
              value.setUpdateTime(now);
              return value;
            }

            @Override
            public boolean runnable(String backfillId) {
              try {
                WorkflowBackfillPO backfill = backfills.require(backfillId);
                return !"CANCELED".equals(backfill.getStatus());
              } catch (IllegalArgumentException missing) {
                return false;
              }
            }

            @Override
            public WorkflowInstanceVO launch(WorkflowScheduleTriggerPO trigger) {
              if (trigger == null || trigger.getBackfillId() == null || trigger.getBackfillId().isBlank()) {
                throw new IllegalArgumentException("Backfill Trigger 缺少 backfillId");
              }
              WorkflowBackfillPO backfill = backfills.require(trigger.getBackfillId());
              boolean operational = operational(backfill);
              WorkflowTriggerContext context = operational
                  ? WorkflowTriggerContext.rerun(
                      trigger.getTriggerId(),
                      backfill.getScheduleId(),
                      backfill.getId(),
                      trigger.getPlannedFireTime(),
                      backfill.getTimezone())
                  : WorkflowTriggerContext.backfill(
                      trigger.getTriggerId(),
                      backfill.getScheduleId(),
                      backfill.getId(),
                      trigger.getPlannedFireTime(),
                      backfill.getTimezone());
              Map<String, Object> input = parameters.forBackfill(backfill, context);
              return operational
                  ? launcher.runOperationalPublished(
                      backfill.getWorkflowId(), backfill.getWorkflowVersionId(), context, input)
                  : launcher.runBackfillPublished(
                      backfill.getWorkflowId(), backfill.getWorkflowVersionId(), context, input);
            }

            private boolean operational(WorkflowBackfillPO backfill) {
              return backfill != null && BUSINESS_DATE_RERUN.equals(backfill.getOperationType());
            }

            private String required(String value, String message) {
              if (value == null || value.isBlank()) throw new IllegalArgumentException(message);
              return value.trim();
            }
          }
          '''.replace("          ", ""))

          # Backfill manager implements the execution-owned rerun port and submits simple trigger facts.
          path = JAVA / "backfill/WorkflowBackfillManager.java"
          text = read(path)
          text = text.replace(
              "import io.yak.ops.business.workflow.definition.WorkflowDefinitionManager;\n",
              "import io.yak.ops.business.workflow.definition.WorkflowDefinitionManager;\n"
              "import io.yak.ops.business.workflow.execution.WorkflowBusinessDateRerunGateway;\n")
          text = text.replace(
              "public class WorkflowBackfillManager {",
              "public class WorkflowBackfillManager implements WorkflowBusinessDateRerunGateway {")
          text = text.replace(
              "  /**\n   * Stage 6：按来源实例的不可变发布版本与调度语义，对指定 businessDate 创建运维补跑。\n"
              "   * 旧实例的系统调度参数和旧运维血缘会被剥离，再根据新的逻辑计划时间重新注入。\n   */\n"
              "  public WorkflowBackfillVO createBusinessDateRerun(",
              "  /**\n   * 按来源实例的不可变发布版本与调度语义，对指定 businessDate 创建运维补跑。\n"
              "   * 旧实例的系统调度参数和旧运维血缘会被剥离，再根据新的逻辑计划时间重新注入。\n   */\n"
              "  @Override\n  public WorkflowBackfillVO createBusinessDateRerun(")
          text = text.replace(
              "        coordinator.submitBackfill(backfill, occurrence);",
              "        coordinator.submitBackfill(\n"
              "            backfill.getId(), occurrence.businessDate(), occurrence.scheduleInstant());")
          write(path, text)

          path = JAVA / "backfill/WorkflowBackfillReconciler.java"
          text = read(path)
          text = text.replace(
              "            coordinator.submitBackfill(backfill, occurrence);",
              "            coordinator.submitBackfill(\n"
              "                backfill.getId(), occurrence.businessDate(), occurrence.scheduleInstant());")
          write(path, text)

          # Trigger coordinator no longer imports backfill implementation types.
          path = JAVA / "schedule/trigger/WorkflowScheduleTriggerCoordinator.java"
          text = read(path)
          text = text.replace(
              "import io.yak.ops.business.workflow.backfill.WorkflowBackfillPlanner;\n"
              "import io.yak.ops.business.workflow.backfill.WorkflowBackfillQuery;\n"
              "import io.yak.ops.business.workflow.execution.WorkflowLauncher;\n",
              "import io.yak.ops.business.workflow.execution.WorkflowExecutionReactivationGuard;\n"
              "import io.yak.ops.business.workflow.execution.WorkflowLauncher;\n")
          text = text.replace(
              "import io.yak.ops.business.workflow.backfill.WorkflowBackfillPlanner.Occurrence;\n",
              "")
          text = text.replace(
              "import io.yak.ops.common.bean.po.workflow.WorkflowBackfillPO;\n",
              "")
          text = text.replace(
              "import java.time.Instant;\nimport java.time.ZoneId;",
              "import java.time.Instant;\nimport java.time.LocalDate;\nimport java.time.ZoneId;")
          text = text.replace(
              "public class WorkflowScheduleTriggerCoordinator {",
              "public class WorkflowScheduleTriggerCoordinator implements WorkflowExecutionReactivationGuard {")
          text = text.replace(
              "  private final WorkflowBackfillQuery backfills;",
              "  private final WorkflowBackfillTriggerGateway backfillGateway;")
          text = text.replace(
              "      WorkflowBackfillQuery backfills,\n      WorkflowScheduleParameterResolver parameters) {",
              "      WorkflowBackfillTriggerGateway backfillGateway,\n"
              "      WorkflowScheduleParameterResolver parameters) {")
          text = text.replace(
              "    this.backfills = backfills;",
              "    this.backfillGateway = backfillGateway;")
          text = text.replace(
              "/** Focused Stage 4 tests retain the original constructor shape. */",
              "/** Focused tests retain the lightweight constructor without Backfill wiring. */")

          old = '''  public ScheduleExecutionResult submitBackfill(
              WorkflowBackfillPO backfill,
              Occurrence occurrence) {
            AdmissionResult result = admission.admitNew(newBackfillTrigger(backfill, occurrence));
            return handleAdmission(
                result,
                isOperationalRerun(backfill)
                    ? "businessDate 运维补跑 Trigger 已获得执行准入"
                    : "Backfill Trigger 已获得执行准入");
          }
          '''.replace("          ", "")
          new = '''  public ScheduleExecutionResult submitBackfill(
              String backfillId,
              LocalDate businessDate,
              Instant plannedFireTime) {
            WorkflowScheduleTriggerPO candidate =
                requireBackfillGateway().createTrigger(backfillId, businessDate, plannedFireTime);
            AdmissionResult result = admission.admitNew(candidate);
            return handleAdmission(
                result,
                BUSINESS_DATE_RERUN.equals(candidate.getTriggerSource())
                    ? "businessDate 运维补跑 Trigger 已获得执行准入"
                    : "Backfill Trigger 已获得执行准入");
          }
          '''.replace("          ", "")
          if old not in text:
              raise RuntimeError("submitBackfill block not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              "  public WorkflowInstanceVO reactivateExecution(\n",
              "  @Override\n  public WorkflowInstanceVO reactivateExecution(\n", 1)

          old = '''  private WorkflowInstanceVO launchBackfill(WorkflowScheduleTriggerPO trigger) {
            if (backfills == null) throw new IllegalStateException("Backfill 查询服务不可用");
            WorkflowBackfillPO backfill = backfills.require(trigger.getBackfillId());
            boolean operational = isOperationalRerun(backfill);
            WorkflowTriggerContext context = operational
                ? WorkflowTriggerContext.rerun(
                    trigger.getTriggerId(),
                    backfill.getScheduleId(),
                    backfill.getId(),
                    trigger.getPlannedFireTime(),
                    backfill.getTimezone())
                : WorkflowTriggerContext.backfill(
                    trigger.getTriggerId(),
                    backfill.getScheduleId(),
                    backfill.getId(),
                    trigger.getPlannedFireTime(),
                    backfill.getTimezone());
            Map<String, Object> input = parameters == null ? Map.of() : parameters.forBackfill(backfill, context);
            return operational
                ? launchService.runOperationalPublished(
                    backfill.getWorkflowId(), backfill.getWorkflowVersionId(), context, input)
                : launchService.runBackfillPublished(
                    backfill.getWorkflowId(), backfill.getWorkflowVersionId(), context, input);
          }
          '''.replace("          ", "")
          new = '''  private WorkflowInstanceVO launchBackfill(WorkflowScheduleTriggerPO trigger) {
            return requireBackfillGateway().launch(trigger);
          }
          '''.replace("          ", "")
          if old not in text:
              raise RuntimeError("launchBackfill block not found")
          text = text.replace(old, new, 1)

          old = '''  private WorkflowScheduleTriggerPO newBackfillTrigger(
              WorkflowBackfillPO backfill,
              Occurrence occurrence) {
            if (backfill == null || occurrence == null) throw new IllegalArgumentException("Backfill Trigger 参数不能为空");
            Instant planned = occurrence.scheduleInstant();
            Instant now = Instant.now();
            boolean operational = isOperationalRerun(backfill);
            WorkflowScheduleTriggerPO value = new WorkflowScheduleTriggerPO();
            value.setId("workflow-trigger-ledger-" + UUID.randomUUID());
            value.setScheduleId(backfill.getScheduleId());
            value.setWorkflowId(backfill.getWorkflowId());
            value.setBackfillId(backfill.getId());
            value.setTriggerId((operational ? "workflow-rerun-" : "workflow-backfill-")
                + backfill.getId() + "-" + planned.toEpochMilli());
            value.setDedupeKey(WorkflowScheduleTriggerIdentity.backfill(
                backfill.getScheduleId(), backfill.getId(), planned));
            value.setTriggerSource(operational ? BUSINESS_DATE_RERUN : "BACKFILL");
            value.setPlannedFireTime(planned);
            value.setActualFireTime(now);
            value.setBusinessDate(occurrence.businessDate());
            value.setExecutionStrategy(backfill.getExecutionStrategy());
            value.setMisfireStrategy("FIRE_ONCE");
            value.setStatus("RECEIVED");
            value.setCreateTime(now);
            value.setUpdateTime(now);
            return value;
          }

          '''.replace("          ", "")
          if old not in text:
              raise RuntimeError("newBackfillTrigger block not found")
          text = text.replace(old, "", 1)

          old = '''  private boolean runnable(WorkflowScheduleTriggerPO trigger) {
            if (isBackfill(trigger)) {
              WorkflowBackfillPO value = safeBackfill(trigger.getBackfillId());
              return value != null && !"CANCELED".equals(value.getStatus());
            }
            WorkflowSchedulePO schedule = safeSchedule(trigger.getScheduleId());
            return schedule != null && "ONLINE".equals(schedule.getStatus());
          }

          private boolean isBackfill(WorkflowScheduleTriggerPO trigger) {
            return trigger.getBackfillId() != null && !trigger.getBackfillId().isBlank();
          }

          private boolean isOperationalRerun(WorkflowBackfillPO backfill) {
            return backfill != null && BUSINESS_DATE_RERUN.equals(backfill.getOperationType());
          }

          private WorkflowSchedulePO safeSchedule(String scheduleId) {
            try {
              return schedules.require(scheduleId);
            } catch (IllegalArgumentException missing) {
              return null;
            }
          }

          private WorkflowBackfillPO safeBackfill(String backfillId) {
            if (backfills == null) return null;
            try {
              return backfills.require(backfillId);
            } catch (IllegalArgumentException missing) {
              return null;
            }
          }

          '''.replace("          ", "")
          new = '''  private boolean runnable(WorkflowScheduleTriggerPO trigger) {
            if (isBackfill(trigger)) {
              return backfillGateway != null && backfillGateway.runnable(trigger.getBackfillId());
            }
            WorkflowSchedulePO schedule = safeSchedule(trigger.getScheduleId());
            return schedule != null && "ONLINE".equals(schedule.getStatus());
          }

          private boolean isBackfill(WorkflowScheduleTriggerPO trigger) {
            return trigger.getBackfillId() != null && !trigger.getBackfillId().isBlank();
          }

          private WorkflowSchedulePO safeSchedule(String scheduleId) {
            try {
              return schedules.require(scheduleId);
            } catch (IllegalArgumentException missing) {
              return null;
            }
          }

          private WorkflowBackfillTriggerGateway requireBackfillGateway() {
            if (backfillGateway == null) {
              throw new IllegalStateException("Backfill Trigger Gateway 不可用");
            }
            return backfillGateway;
          }

          '''.replace("          ", "")
          if old not in text:
              raise RuntimeError("runnable/safeBackfill block not found")
          text = text.replace(old, new, 1)
          write(path, text)

          # Backfill tests follow the narrow trigger gateway contract.
          for name in ("WorkflowBackfillTriggerCoordinatorTest.java", "WorkflowBusinessDateRerunCoordinatorTest.java"):
              path = TEST / "backfill" / name
              text = read(path)
              text = text.replace(
                  "  private WorkflowScheduleTriggerCoordinator coordinator;\n",
                  "  private WorkflowScheduleTriggerCoordinator coordinator;\n"
                  "  private WorkflowBackfillTriggerAdapter backfillTriggerAdapter;\n")
              text = text.replace(
                  "    coordinator = new WorkflowScheduleTriggerCoordinator(\n"
                  "        ledger, schedules, launchService, admission, backfills, parameters);",
                  "    backfillTriggerAdapter =\n"
                  "        new WorkflowBackfillTriggerAdapter(backfills, parameters, launchService);\n"
                  "    coordinator = new WorkflowScheduleTriggerCoordinator(\n"
                  "        ledger, schedules, launchService, admission, backfillTriggerAdapter, parameters);")
              text = text.replace(
                  "coordinator.submitBackfill(backfill, occurrence)",
                  "coordinator.submitBackfill(\n"
                  "        backfill.getId(), occurrence.businessDate(), occurrence.scheduleInstant())")
              text = text.replace(
                  "coordinator.submitBackfill(batch, occurrence)",
                  "coordinator.submitBackfill(\n"
                  "        batch.getId(), occurrence.businessDate(), occurrence.scheduleInstant())")
              write(path, text)

          path = TEST / "backfill/WorkflowBackfillReconcilerTest.java"
          text = read(path)
          text = text.replace(
              "    verify(coordinator).submitBackfill(backfill, first);\n"
              "    verify(coordinator).submitBackfill(backfill, second);",
              "    verify(coordinator).submitBackfill(\n"
              "        backfill.getId(), first.businessDate(), first.scheduleInstant());\n"
              "    verify(coordinator).submitBackfill(\n"
              "        backfill.getId(), second.businessDate(), second.scheduleInstant());")
          write(path, text)

          path = TEST / "backfill/WorkflowBusinessDateRerunTest.java"
          text = read(path)
          text = text.replace(
              "    verify(coordinator).submitBackfill(any(WorkflowBackfillPO.class), any());",
              "    verify(coordinator).submitBackfill(\n"
              "        eq(batch.getId()), eq(LocalDate.of(2026, 8, 10)), any(Instant.class));")
          if "import static org.mockito.ArgumentMatchers.eq;" not in text:
              text = text.replace(
                  "import static org.mockito.ArgumentMatchers.any;\n",
                  "import static org.mockito.ArgumentMatchers.any;\n"
                  "import static org.mockito.ArgumentMatchers.eq;\n")
          write(path, text)

          # Current-contract comments only; no migration-stage prose in production.
          replace(
              JAVA / "execution/WorkflowLauncher.java",
              "/** Focused tests retain the Stage 4 constructor. */",
              "/** Focused tests retain the lightweight constructor without pinned-version wiring. */")
          path = JAVA / "schedule/trigger/WorkflowScheduleTriggerAdmission.java"
          text = read(path)
