          # Workflow Domain

          本文件定义 Workflow **当前领域事实、生命周期和 truth ownership**。历史迁移过程不属于 Domain contract。

          ## 1. Core Identity

          Workflow 中必须长期区分：

          ```text
          WorkflowDefinition
              != WorkflowVersion
              != WorkflowExecutionMetadata
              != Engine WorkflowExecution
              != NodeExecution
              != NodeAttempt
              != WorkflowSchedule
              != WorkflowScheduleTrigger
              != WorkflowBackfill
          ```

          它们字段相似也不能合并成一个通用 Job/Task 状态对象。

          ## 2. Truth Ownership

          | Truth | Owner |
          | --- | --- |
          | 当前可编辑 DAG / input / editor metadata | Yak Ops `WorkflowDefinition` |
          | 不可变发布 DAG + Task revision snapshot | Yak Ops `WorkflowVersion` |
          | version/testRun/trigger 等运行业务上下文 | Yak Ops runtime metadata |
          | WorkflowExecution lifecycle | Yak Workflow Engine |
          | NodeExecution lifecycle | Yak Workflow Engine |
          | NodeAttempt lifecycle | Yak Workflow Engine |
          | Schedule 配置 | Yak Ops `WorkflowSchedule` |
          | Trigger dedupe / admission / lineage | Yak Ops Trigger Ledger |
          | Backfill 批次与 pinned version | Yak Ops `WorkflowBackfill` |
          | 时间触发计算/回调 | Yak Schedule projection |
          | 节点对应的真实 TaskExecution | Business Job / TaskExecutionGateway |

          `WorkflowTruth` 只命名这些 owner，不创建新的状态存储。

          ## 3. WorkflowDefinition

          Definition 是 current mutable configuration。

          它可以反复编辑，但 current draft 不能改变已经发布的 WorkflowVersion，也不能改变历史 WorkflowExecution 的运行语义。

          Definition 的 last execution 字段属于展示投影，不是新的运行状态 owner。

          ## 4. WorkflowVersion

          WorkflowVersion 是 publish-time immutable snapshot。

          ```text
          Draft revision N
              -> graph validation
              -> runtime graph selection
              -> TaskRevision snapshot
              -> WorkflowVersion N (immutable)
          ```

          硬规则：

          - version number 对同一 workflow 单调递增；
          - version 绑定 source draft revision；
          - run spec / task versions / editor metadata 发布后不可变；
          - current TaskAsset revision 更新不能漂移到历史 version；
          - Backfill / operational rerun 可以显式固定历史 published version。

          ## 5. Launch And Execution Metadata

          一次 launch 需要同时区分：

          ```text
          为什么启动          -> TriggerContext / launch metadata
          用哪个业务版本      -> WorkflowVersion identity
          engine 如何运行      -> WorkflowExecution runtime state
          ```

          Yak Ops 可以保存 workflowVersionId/no、testRun、triggerId、scheduleId、plannedFireTime 等 metadata；这些字段不能反向覆盖 engine 状态。

          ## 6. Engine Runtime Truth

          `WorkflowExecution / NodeExecution / NodeAttempt` 的状态机只存在于 Yak Workflow Engine。

          Yak Ops Runtime 是适配层：负责注册 definition、调用 engine 命令、驱动 TaskExecution、恢复 durable metadata、投影 VO。

          禁止：

          - 在 Yak Ops 再建一套与 engine 并行的 Node/Attempt 状态机；
          - 用 `latestExecutionStatus` 等 projection 覆盖 durable engine evidence；
          - 因为 HTTP/Task gateway 一次调用失败就猜测 engine 已经失败；
          - current Definition 变化后重写运行中/历史 execution 的 definition snapshot。

          ## 7. Retry Versus New Execution

          这是 Workflow 的硬语义：

          ```text
          retry failed node / retry failed nodes / continue after failure
              -> same WorkflowExecution

          restart / rerun from node
              -> new WorkflowExecution
          ```

          原地恢复终态实例时，如果该实例来自 Trigger Ledger，必须先重新获得工作流并发槽位。否则可能与已经推进的 SERIAL_WAIT 队首形成并发。

          ## 8. TaskVersion And TaskExecution

          `TaskVersionSnapshot` 与 `TaskExecution` 不是一回事。

          - TaskVersionSnapshot 在 WorkflowVersion/运行准备时固定“要执行什么”；
          - TaskExecutionGateway 返回“外部任务实际执行成什么”；
          - NodeAttempt 绑定 external execution id 使进程重启后能继续查询；
          - 一个旧 NodeAttempt 不能因为 current Task 定义变化而切换任务版本。

          ## 9. Schedule Truth

          `WorkflowSchedule` 是 durable schedule definition；Yak Schedule 只是 runtime timer projection。

          因此：

          - schedule save/online/offline/delete 以业务表为准；
          - framework schedule 丢失后可以 reconcile；
          - framework nextFireTime 可以投影回业务表，但不能决定 schedule 配置；
          - workflow offline 后不允许新的普通 scheduled execution；
          - schedule callback 必须进入 Trigger Ledger，而不是直接 start engine。

          ## 10. Trigger Ledger

          WorkflowScheduleTrigger 表示“一次计划触发”的 durable identity 和准入证据。

          ```text
          Schedule / Backfill occurrence
                  |
                  v
              Trigger Ledger
                  |
             admission/dedupe
                  |
                  v
             WorkflowLauncher
                  |
                  v
             WorkflowExecution
          ```

          关键不变量：

          - dedupe key 对同一逻辑计划唯一；
          - plannedFireTime 是业务计划时间，actualFireTime 是实际到达时间，两者不能混淆；
          - execution strategy 在 Trigger 创建时固定；
          - SERIAL_WAIT 队列推进必须在 durable ledger 上完成；
          - Trigger terminal 与 WorkflowExecution terminal 可以有不同枚举，但必须有确定映射；
          - Trigger 只记录 execution identity/状态证据，不成为 engine runtime owner。

          ## 11. Backfill

          WorkflowBackfill 是“批次”，不是一个 Execution。

          它固定：

          - workflow identity；
          - immutable workflowVersionId/no；
          - schedule identity/name；
          - cron/timezone snapshot；
          - business-date range；
          - execution strategy；
          - batch input；
          - operation type / sourceExecutionId（运维补跑时）。

          一个 Backfill 通过多个 Trigger Ledger 记录物化为多个 WorkflowExecution。

          Backfill cancel 不回滚已经运行的 Execution；它只阻止尚未启动的 occurrence。

          ## 12. Recovery Truth

          Recovery 只能依据 durable evidence：

          - engine execution snapshot；
          - runtime metadata；
          - external task execution binding；
          - Trigger Ledger；
          - Schedule/Backfill durable definitions。

          内存中的 queue/control map 都是可重建 runtime state，不是持久业务 truth。

          ## 13. Observability

          SSE、日志、列表/详情 VO 是 projection。

          ```text
          durable engine/business evidence
                    |
                    v
              read / SSE projection
          ```

          客户端断开、日志失败或 SSE heartbeat 失败都不能修改 Execution 结果。

          ## 14. Domain Gap Rule

          出现以下需求时先报告 **Domain Gap**，不要增加隐藏 flag：

          - 运行中的 Execution 自动切换到最新 WorkflowVersion；
          - retry 被要求创建新 Execution，但又继续复用原 execution identity；
          - Trigger 不经过 durable admission 就直接启动；
          - SERIAL_WAIT 允许同时占用多个槽位；
          - Backfill 创建后自动跟随新的 active version；
          - Yak Ops 与 Yak Workflow Engine 同时被要求拥有 Node/Attempt 状态；
          - Schedule framework snapshot 被要求反向成为业务配置真相。

          现有领域表达不了的新需求，应先更新本文件和行为测试，再修改实现。
          '''))

          write(ROOT / "ARCHITECTURE.md", textwrap.dedent('''\
          # Workflow Architecture

          本文件描述 Workflow **当前长期架构**。它记录现在有效的 package、角色、truth ownership 和调用 corridor，不记录迁移过程。

          需求看 `REQUIREMENTS.md`，领域规则看 `DOMAIN.md`，依赖矩阵看 `DEPENDENCIES.md`，统一工程规范看仓库根目录 [`../../CODE_STYLE.md`](../../CODE_STYLE.md)。

          ## 1. Principles

          1. **Package is architecture.** Definition / Execution / Runtime / Schedule / Trigger / Backfill 按业务子系统组织，而不是统一放进 Service/Impl。
          2. **Role name is contract.** Manager / Launcher / Runtime / Query / Coordinator / Reconciler / Adapter 各自表达职责。
          3. **Version 与 Runtime 分离。** mutable Definition、immutable Version、engine Execution 不能合并。
          4. **运行真相单一 owner。** WorkflowExecution / Node / Attempt 由 Yak Workflow Engine 拥有。
          5. **计划触发先入 Ledger。** Schedule / Backfill 先完成 durable admission，再进入 Launcher。
          6. **历史执行冻结。** Published Version / Task snapshot / Trigger strategy 不能被 current config 隐式改写。
          7. **跨子系统使用窄 corridor。** 需要反向协作时由能力使用方定义窄 Port，避免 package cycle。
          8. **规则可执行。** dependency / layering / role / code-style tests 与文档一起维护。

          ## 2. Package Map

          ```text
          io.yak.ops.business.workflow
          ├── controller
          │   └── v1
          ├── definition              # draft / version / graph / task binding
          ├── execution               # launcher / operations / reactivation ports
          ├── runtime                 # engine runtime adapter / recovery
          ├── schedule                # schedule definition lifecycle / reconcile
          │   ├── engine              # Yak Schedule bridge
          │   └── trigger             # durable trigger ledger / admission / queue
          ├── backfill                # backfill batch / rerun / trigger adapter
          ├── observability           # SSE projection
          ├── repository              # durable business/engine persistence adapters
          │   └── support
          ├── dao                     # MyBatis/ledger persistence primitives
          └── domain                  # workflow values / identities / immutable semantics
          ```

          production 不创建 `service / common / helper / utils / base / persistence` 业务大桶。

          ## 3. Application Entry

          Workflow 保留少量真正稳定的 Application/Runtime facades：

          ```text
          WorkflowDefinitionManager
          WorkflowLauncher
          WorkflowExecutionManager
          WorkflowExecutionReactivator
          WorkflowRuntime
          WorkflowBackfillManager
          ```

          它们可以使用 `@Service`，因为它们是稳定 use-case boundary，而不是因为“所有 Bean 都叫 Service”。

          Planner / Query / Coordinator / Reconciler / Adapter / Guard / EventStream 等内部专业角色使用 `@Component`。

          ## 4. Definition Subsystem

          ```text
          Controller
              -> WorkflowDefinitionManager
                   -> WorkflowTaskBindingResolver
                   -> WorkflowStartGraphCompiler
                   -> WorkflowDefinitionRepository
                   -> WorkflowRuntime      # existing definition-bound run/control corridor
          ```

          DefinitionManager 拥有 current draft、publish、active version、Task revision binding 与 definition-level safety。

          `WorkflowStartGraphCompiler` 只把编辑态图转换为运行图；`WorkflowTaskBindingResolver` 负责 TaskAsset/TaskRevision snapshot；它们不拥有发布状态。

          Schedule 激活/停用联动属于 `schedule.WorkflowDefinitionScheduleGuard`，避免 Definition 反向依赖 Schedule 生命周期。

          ## 5. Execution / Launch Subsystem

          `WorkflowLauncher` 是创建新 WorkflowExecution 的统一 corridor：

          ```text
          Manual/API
          Draft Test
          Schedule Trigger
          Backfill Trigger
          Restart / Rerun
                  |
                  v
            WorkflowLauncher
                  |
                  +-> resolve active/pinned version
                  +-> record TriggerContext
                  v
            WorkflowRuntime
          ```

          `WorkflowExecutionReactivator` 处理同一个 Execution 的 retry/continue。它只依赖 execution-owned `WorkflowExecutionReactivationGuard`；Schedule Trigger Coordinator 实现该 Port，从而能施加 Ledger 串行槽位规则而不制造 execution -> schedule package cycle。

          `WorkflowExecutionManager` 负责实例运维 read/use-case。businessDate rerun 通过 execution-owned `WorkflowBusinessDateRerunGateway` 进入 Backfill，而不是直接认识 Backfill 实现。

          ## 6. Runtime Subsystem

          ```text
          WorkflowRuntime
              -> Yak Workflow Engine
              -> TaskExecutionGateway
              -> WorkflowRuntimeRepository
              -> WorkflowEventStream
          ```

          Runtime 负责 engine adapter、NodeDispatch、TaskExecution polling、timeout、pause/resume/cancel、retry/restart/rerun 和 VO projection。

          `WorkflowRuntimeRecovery` 只负责应用启动后的 durable recovery orchestration，不成为第二 runtime owner。

          Runtime 内存中的 dispatch queue、control map、active set 都是可恢复辅助状态。

          ## 7. Schedule Subsystem

          ```text
          WorkflowSchedule create/revision/lifecycle
              -> durable schedule DAO
              -> WorkflowScheduleEngineBridge
                   -> Yak Schedule

          Yak Schedule callback
              -> WorkflowScheduleTriggerHandler
              -> WorkflowScheduleTriggerCoordinator
          ```

          `WorkflowScheduleEngineBridge` 是 framework boundary；Schedule 业务表仍是配置 truth。

          `WorkflowScheduleReconciler` 恢复 framework projection；`WorkflowScheduleRuntimeState` 只维护 last/next fire projection；`WorkflowScheduleMisfireRecovery` 生成可审计的恢复 Trigger。

          ## 8. Trigger Ledger Subsystem

          ```text
          callback / Backfill occurrence
                  -> WorkflowScheduleTriggerCoordinator
                  -> WorkflowScheduleTriggerAdmission
                  -> durable Trigger Ledger
                  -> WorkflowLauncher
          ```

          Admission 拥有 claim/dedupe、SERIAL_WAIT/SERIAL_DISCARD/PARALLEL、LAUNCHING/REACTIVATING reservation、execution binding 与队首推进。

          Coordinator 负责跨步骤编排，不复制 Admission 的事务规则。

          Backfill-specific trigger 创建/加载/launch 被隔离在 `WorkflowBackfillTriggerGateway` 后面；其实现位于 Backfill 子系统，Schedule 不 import Backfill implementation。

          ## 9. Backfill Subsystem

          ```text
          WorkflowBackfillManager
              -> WorkflowBackfillPlanner
              -> durable Backfill DAO
              -> WorkflowScheduleTriggerCoordinator

          WorkflowBackfillTriggerAdapter
              -> WorkflowBackfillQuery
              -> WorkflowScheduleParameterResolver
              -> WorkflowLauncher
          ```

          Manager 拥有批次 create/cancel/businessDate rerun；Planner 只生成 occurrence；Reconciler 只根据 durable batch 补齐 Trigger。

          Backfill 实现 execution-owned `WorkflowBusinessDateRerunGateway`，让 Execution use-case 不反向依赖 Backfill package。

          ## 10. Observability

          `WorkflowEventStream` 只维护 SSE client 与 heartbeat，并消费 Runtime 投影。

          它不读取/修改 Definition、Schedule、Trigger Ledger 或 Engine persistence，SSE 断开也不影响执行。

          ## 11. Persistence Boundary

          Workflow 当前存在两类 durable boundary：

          ```text
          Definition / Runtime
              -> Workflow*Repository
              -> Repository Adapter
              -> DAO / Engine SPI

          Schedule / Trigger / Backfill coordination
              -> narrow Workflow*Dao ledger primitives
          ```

          Schedule/Trigger/Backfill 的 DAO 直接使用是当前短事务/ledger coordination contract；不得扩散到 Controller 或 Domain。若未来进一步收口 Repository，应作为独立 persistence refactor，不借治理白名单伪装。

          Repository contract 不暴露 Workflow HTTP DTO/VO/PO/MyBatis。

          ## 12. Cross-module Boundaries

          ### Yak Workflow Engine

          Runtime 与 engine persistence adapter 可以依赖 `yak-workflow-engine`。业务层不重新实现 engine state machine。

          ### Business Job

          ```text
          Definition -> TaskRegistry / TaskAsset revision resolution
          Runtime    -> TaskExecutionGateway
          ```

          Workflow 不直接执行具体任务实现。

          ### Yak Schedule

          只有 Schedule framework boundary 负责保存/暂停/删除 timer projection；业务 Trigger 仍由 Workflow Trigger Ledger 管理。

          ## 13. Truth Ownership

          ```text
          Definition              = current mutable config
          Version                 = immutable publish snapshot
          Runtime metadata        = Yak Ops launch/version/trigger context
          Engine Execution        = runtime state truth
          Schedule                = durable timer config
          Trigger Ledger          = dedupe/admission/lineage truth
          Backfill                = pinned-version batch truth
          SSE/log                 = projection only
          ```

          出现两个角色同时决定同一个 truth 时，先修 ownership，不要通过静态 Context、Helper 或新的状态字段掩盖冲突。

          ## 14. Change Rule

          新增/移动代码前回答：

          1. 属于哪个 Workflow subsystem？
          2. 它是 Manager / Launcher / Runtime / Query / Coordinator / Reconciler / Adapter 中哪个角色？
          3. 它拥有哪个 truth，还是只读取/投影？
          4. 新 dependency 是否符合 `DEPENDENCIES.md`？
          5. 是否让 current Definition/Task revision 漂移进历史 Version/Execution？
          6. 是否绕过 Trigger Ledger 或 WorkflowLauncher？
          7. 是否制造第二个 engine runtime owner？
          8. 哪个 behavior test 和 architecture test 会保护这次修改？

          答不清楚时不要创建新的 ServiceImpl/Common/Helper。
          '''))

          write(ROOT / "DEPENDENCIES.md", textwrap.dedent('''\
          # Workflow Dependencies

          本文件定义 Workflow package 的**允许依赖方向、跨子系统 corridor 和外部边界**。原则：**显式、窄、无环**。

          架构角色看 `ARCHITECTURE.md`；统一工程规则看仓库根目录 [`../../CODE_STYLE.md`](../../CODE_STYLE.md)。代码与本文件冲突时，先判断 ownership/placement 是否错误，不要第一反应扩大白名单。

          ## 1. Top-level Dependency Matrix

          Workflow production 内部允许的 top-level 依赖：

          | Source | Allowed Workflow packages |
          | --- | --- |
          | `controller` | `backfill`, `definition`, `domain`, `execution`, `runtime`, `schedule` |
          | `backfill` | `dao`, `definition`, `domain`, `execution`, `repository`, `schedule` |
          | `schedule` | `dao`, `definition`, `domain`, `execution`, `repository` |
          | `execution` | `dao`, `domain`, `repository`, `runtime` |
          | `definition` | `dao`, `domain`, `repository`, `runtime` |
          | `runtime` | `domain`, `observability`, `repository` |
          | `observability` | none |
          | `repository` | `dao`, `domain` |
          | `dao` | none |
          | `domain` | none |

          同一 top-level package 内部可以协作，但不会因此自动成为其他 package 的公共 API。

          声明图和实际源码图都必须无环。

          ## 2. Controller Corridors

          Controller 只能进入稳定业务/运行入口：

          ```text
          definition -> WorkflowDefinitionManager
          execution  -> WorkflowLauncher / WorkflowExecutionManager / WorkflowExecutionReactivator
          runtime    -> WorkflowRuntime
          schedule   -> create/revision/lifecycle/query + trigger query
          backfill   -> WorkflowBackfillManager / WorkflowBackfillQuery
          ```

          Controller 不直接依赖 DAO、Repository、Schedule Engine Bridge 或 Trigger Admission/Coordinator。

          ## 3. Definition -> Runtime

          当前 definition-bound run/control 行为只允许：

          ```text
          WorkflowDefinitionManager -> WorkflowRuntime
          ```

          Graph compiler、Task binding resolver 不直接调用 Runtime。

          Schedule activation guard 已归属 Schedule，不允许重新建立 `definition -> schedule -> definition` 环。

          ## 4. Execution -> Runtime

          Execution 创建/控制实例只允许进入 `WorkflowRuntime`。

          ```text
          WorkflowLauncher              -> WorkflowRuntime
          WorkflowExecutionManager      -> WorkflowRuntime
          WorkflowExecutionReactivator  -> WorkflowRuntime
          WorkflowPublishedVersionRunner -> WorkflowRuntime
          ```

          Execution 不直接依赖 Schedule/Backfill 实现。需要反向策略时使用 execution-owned Port。

          ## 5. Schedule -> Execution

          Schedule/Trigger 跨入 Execution 当前只允许：

          ```text
          WorkflowScheduleTriggerCoordinator
              -> WorkflowLauncher
              -> WorkflowExecutionReactivationGuard (implemented by coordinator)
          ```

          Trigger 不能直接 start Yak Workflow Engine，也不能调用 Runtime 绕过 Launcher。

          ## 6. Backfill Corridors

          Backfill -> Schedule 允许的稳定角色：

          ```text
          WorkflowScheduleQuery
          WorkflowScheduleParameterResolver
          WorkflowScheduleTriggerAdmission
          WorkflowScheduleTriggerCoordinator
          WorkflowBackfillTriggerGateway
          ```

          Backfill -> Execution 只允许：

          ```text
          WorkflowBusinessDateRerunGateway
          WorkflowLauncher
          ```

          `WorkflowBackfillTriggerAdapter` 实现 Schedule-owned `WorkflowBackfillTriggerGateway`；Schedule 不 import `workflow.backfill.*`。

          ## 7. Runtime -> Observability

          Runtime 对 Observability 只有：

          ```text
          WorkflowRuntime -> WorkflowEventStream
          ```

          Observability 不反向依赖 Runtime、Execution、Schedule 或 Repository。

          ## 8. Persistence Boundary

          Definition/Runtime 的 durable business contract：

          ```text
          role -> WorkflowDefinitionRepository / WorkflowRuntimeRepository
               -> adapter -> DAO / engine SPI
          ```

          Schedule/Trigger/Backfill 当前允许直接使用自己明确的 DAO/ledger primitive，但：

          - Controller 不得依赖 DAO；
          - Domain 不得依赖 DAO/Repository；
          - DAO 不得反向依赖业务 package；
          - Repository 只能向下依赖 DAO/Domain；
          - Repository contract 不暴露 Workflow DTO/VO/PO/MyBatis 类型。

          ## 9. Yak Workflow Engine Boundary

          Engine runtime state owner 保持在 `yak-workflow-engine`。

          允许的职责：

          - `runtime` 调用 Engine API/SPI；
          - `repository` 适配 Engine Definition/Execution persistence；
          - Execution read-side 可以通过已经注入的 engine repository 读取历史 DAG evidence，但不能写 engine state。

          新的 engine command 不应出现在 Controller/Schedule/Backfill。

          ## 10. Business Job Boundary

          Definition 可以使用 Task Registry/Catalog 来冻结 TaskVersionSnapshot；Runtime 可以使用 TaskExecutionGateway 来执行/查询具体任务。

          其他 Workflow package 不直接认识具体 Offline/Realtime/SQL executor 实现。

          ## 11. Yak Schedule Boundary

          `schedule.engine.WorkflowScheduleEngineBridge` 是 Yak Schedule 的 framework adapter。

          Trigger Handler 可以接收 Schedule callback，但必须立即进入 Workflow Trigger Ledger。Yak Schedule snapshot 不成为 WorkflowSchedule 配置 owner。

          ## 12. No Cycles

          不允许通过以下方式掩盖 package cycle：

          - `@Lazy`；
          - ApplicationContext lookup；
          - static Service Locator；
          - 把双方接口随意扔进 `common`；
          - 扩大 dependency-test 白名单。

          当前两类反向协作使用 owner-defined Port：

          ```text
          execution.WorkflowExecutionReactivationGuard
              <- schedule.trigger.WorkflowScheduleTriggerCoordinator

          execution.WorkflowBusinessDateRerunGateway
              <- backfill.WorkflowBackfillManager

          schedule.trigger.WorkflowBackfillTriggerGateway
              <- backfill.WorkflowBackfillTriggerAdapter
          ```

          ## 13. Adding A New Dependency

          新 import 不在矩阵时依次判断：

          1. 类是否放错 package？
          2. 已有 stable role / Port 是否足够？
          3. 能否由 capability owner 定义一个窄 interface？
          4. 架构是否真的改变？

          只有第 4 种情况才在同一 PR 更新 `ARCHITECTURE.md`、本文件和 executable dependency test。
          '''))

