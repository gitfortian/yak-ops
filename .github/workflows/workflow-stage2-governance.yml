          # ------------------------------------------------------------------
          # Static final consistency checks before committing.
          # ------------------------------------------------------------------
          production = JAVA
          for forbidden in ("service", "common", "helper", "utils", "util", "base", "persistence"):
              if (production.joinpath(forbidden).exists():
                  raise RuntimeError(f"forbidden Workflow bucket exists: {forbidden}")

          all_java = list(production.rglob("*.java"))
          for file in all_java:
              source = read(file)
              if "io.yak.ops.business.workflow.service." in source:
                  raise RuntimeError(f"retired service import in {file}")
              if "io.yak.ops.business.workflow.persistence." in source:
                  raise RuntimeError(f"retired persistence import in {file}")
              if re.search(r"(?i)\b(Stage|Wave|Phase)\s*[-:]?\s*\d+\b", source):
                  raise RuntimeError(f"migration-stage comment remains in {file}")

          # Assert actual top-level workflow import graph is acyclic and inside declared matrix.
          allowed = {
              "controller": {"backfill", "definition", "domain", "execution", "runtime", "schedule"},
              "backfill": {"dao", "definition", "domain", "execution", "repository", "schedule"},
              "schedule": {"dao", "definition", "domain", "execution", "repository"},
              "execution": {"dao", "domain", "repository", "runtime"},
              "definition": {"dao", "domain", "repository", "runtime"},
              "runtime": {"domain", "observability", "repository"},
              "observability": set(),
              "repository": {"dao", "domain"},
              "dao": set(),
              "domain": set(),
          }
          import_re = re.compile(
              r"(?m)^import\s+(?:static\s+)?io\.yak\.ops\.business\.workflow\.([A-Za-z0-9_]+)\.[^;]+;")
          graph = {key: set() for key in allowed}
          for file in all_java:
              rel = file.relative_to(production)
              if len(rel.parts) < 2:
                  continue
              source_pkg = rel.parts[0]
              for target in import_re.findall(read(file)):
                  if target == source_pkg:
                      continue
                  if target not in allowed.get(source_pkg, set()):
                      raise RuntimeError(f"undeclared dependency {source_pkg}->{target} in {rel}")
                  graph.setdefault(source_pkg, set()).add(target)

          visiting = set()
          visited = set()
          def visit(node, stack):
              if node in visiting:
                  raise RuntimeError("workflow package cycle: " + " -> ".join(stack + [node]))
              if node in visited:
                  return
              visiting.add(node)
              for target in graph.get(node, set()):
                  visit(target, stack + [node])
              visiting.remove(node)
              visited.add(node)
          for node in graph:
              visit(node, [])

          for required in (
              ROOT / "README.md",
              ROOT / "REQUIREMENTS.md",
              ROOT / "DOMAIN.md",
              ROOT / "ARCHITECTURE.md",
              ROOT / "DEPENDENCIES.md",
              ROOT / "REVIEW.md",
          ):
              if not required.is_file():
                  raise RuntimeError(f"missing governance document: {required}")

          print("Workflow governance static consistency checks passed")
