name: PR3 Spotless Only (temporary)

on:
  push:
    branches:
      - feat/yakflow-jdbc-metadata-ddl-20261023

permissions:
  contents: read

concurrency:
  group: yakflow-pr3-spotless-only
  cancel-in-progress: true

jobs:
  spotless:
    name: Spotless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Java formatting only
        run: bash mvnw -B -ntp -DskipTests -pl yak-flow/yak-flow-connector-jdbc -am com.diffplug.spotless:spotless-maven-plugin:3.10.2:check
