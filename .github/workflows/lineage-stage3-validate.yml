name: Lineage Stage 3 Validation

on:
  push:
    branches:
      - refactor/lineage-stage3-service-facades

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix mechanical rename and normalize imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          test_file = root / "yak-ops-business/yak-ops-business-data-development/src/test/java/io/yak/ops/business/development/service/DevelopmentSqlLineageServiceTest.java"
          text = test_file.read_text(encoding="utf-8")
          text = text.replace("DevelopmentSqlLineageWriteService", "DevelopmentSqlLineageService")
          test_file.write_text(text, encoding="utf-8")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD", "--", "*.java"],
              text=True,
          ).splitlines()

          for name in changed:
              file = root / name
              if not file.is_file():
                  continue
              lines = file.read_text(encoding="utf-8").splitlines()
              while lines and not lines[0].strip():
                  lines.pop(0)
              import_indexes = [i for i, line in enumerate(lines) if line.startswith("import ")]
              if import_indexes:
                  start, end = import_indexes[0], import_indexes[-1]
                  imports = [line for line in lines[start:end + 1] if line.startswith("import ")]
                  static_imports = sorted(line for line in imports if line.startswith("import static "))
                  regular_imports = sorted(line for line in imports if not line.startswith("import static "))
                  block = static_imports
                  if static_imports and regular_imports:
                      block += [""]
                  block += regular_imports
                  lines = lines[:start] + block + lines[end + 1:]
              file.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

          chmod +x mvnw
          git diff --check

      - name: Compile affected modules
        shell: bash
        run: |
          ./mvnw -B -ntp \
            -pl yak-ops-business/yak-ops-business-lineage,yak-ops-business/yak-ops-business-data-development,yak-ops-business/yak-ops-business-dataset,yak-ops-business/yak-ops-business-analysis,yak-ops-business/yak-ops-business-dashboard \
            -am -DskipTests compile

      - name: Run focused lineage tests
        shell: bash
        run: |
          ./mvnw -B -ntp \
            -pl yak-ops-business/yak-ops-business-lineage,yak-ops-business/yak-ops-business-data-development \
            -am \
            -Dtest=LineageServicesTest,LineageMaintenanceServiceTest,LineageArchitectureTest,LineageDependencyBoundaryTest,DevelopmentSqlLineageServiceTest,DevelopmentSqlLineagePreviewServiceTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

      - name: Commit validated result
        shell: bash
        run: |
          rm -f .github/workflows/lineage-stage3-validate.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(lineage): validate stage 3 service boundaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
