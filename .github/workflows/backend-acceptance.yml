name: Backend E2E (Release)

on:
  workflow_call:
    inputs:
      full_sweep:
        description: Run all backend database E2E suites for a release.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-status:
    name: Backend E2E Not Run
    if: ${{ inputs.full_sweep != true && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped backend E2E
        shell: bash
        run: |
          echo "::notice::Backend E2E was not requested; no database suites ran."
          {
            echo "## Backend E2E: NOT RUN"
            echo ""
            echo "Set full_sweep=true or run Backend E2E Tests to test with real databases."
          } >> "${GITHUB_STEP_SUMMARY}"

  full-acceptance:
    name: Full Backend E2E
    if: ${{ inputs.full_sweep == true || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/backend-e2e.yml
