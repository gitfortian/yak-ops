name: PR5 Spotless Only

on:
  push:
    branches:
      - feat/yakflow-schema-manager-coordination-20261023
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr5-spotless-only
  cancel-in-progress: true

jobs:
  spotless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply Spotless and export only formatting changes
        run: |
          bash mvnw -B -ntp -pl yak-ops-core,yak-flow/yak-flow-runtime,yak-flow/yak-flow-connector-jdbc com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          for path in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines():
              print("PR5_FORMATTED_FILE_JSON:" + json.dumps(
                  {"path": path, "content": Path(path).read_text(encoding="utf-8")},
                  ensure_ascii=False))
          PY
          git diff --exit-code --quiet
