name: PR2 Validation Preview

on:
  push:
    branches:
      - refactor/seatunnel-connector-task-configuration

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Spotless formatting
        run: bash mvnw -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Verify backend without a redundant format recheck
        continue-on-error: true
        run: bash mvnw -pl '!yak-ops-ui,!yak-ops-dist' -Dspotless.check.skip=true verify
      - name: Export exact formatted Java files
        if: always()
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "FORMATTED_FILE_PATH:$file"
            base64 -w 0 "$file"
            printf '\nFORMATTED_FILE_END\n'
          done < <(git diff --name-only -- '*.java')
