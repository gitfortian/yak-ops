name: Backend Compile

on:
  pull_request:
    paths:
      - 'pom.xml'
      - '**/pom.xml'
      - 'yak-ops-bom/**'
      - 'yak-ops-common/**'
      - 'yak-ops-spi/**'
      - 'yak-ops-core/**'
      - 'yak-ops-business/**'
      - 'yak-ops-plugins/**'
      - 'yak-ops-boot/**'
      - '.github/workflows/backend-compile.yml'
  push:
    branches:
      - main
    paths:
      - 'pom.xml'
      - '**/pom.xml'
      - 'yak-ops-bom/**'
      - 'yak-ops-common/**'
      - 'yak-ops-spi/**'
      - 'yak-ops-core/**'
      - 'yak-ops-business/**'
      - 'yak-ops-plugins/**'
      - 'yak-ops-boot/**'
      - '.github/workflows/backend-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile backend with Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Yak Ops
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile Yak Ops backend
        run: ./mvnw -B -ntp -DskipTests -pl yak-ops-boot -am compile
