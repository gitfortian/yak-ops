name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Yak Ops tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load release metadata
        shell: bash
        run: |
          set -a
          source release.env
          set +a
          grep -E '^[A-Z0-9_]+=' release.env >> "$GITHUB_ENV"

      - name: Validate release tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$YAK_OPS_VERSION" ]]; then
            echo "Tag version $tag_version does not match release.env version $YAK_OPS_VERSION" >&2
            exit 1
          fi

      - name: Validate release credentials
        shell: bash
        env:
          YAK_FRAMEWORK_READ_TOKEN: ${{ secrets.YAK_FRAMEWORK_READ_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          for name in YAK_FRAMEWORK_READ_TOKEN DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for public releases."
              missing=1
            fi
          done
          if (( missing != 0 )); then
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Checkout pinned Yak Framework
        uses: actions/checkout@v7
        with:
          repository: weifuwan/yak-framework
          ref: ${{ env.YAK_FRAMEWORK_REF }}
          path: .deps/yak-framework
          token: ${{ secrets.YAK_FRAMEWORK_READ_TOKEN }}
          persist-credentials: false

      - name: Install pinned Yak Framework
        working-directory: .deps/yak-framework
        run: mvn -B -ntp -DskipTests install

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yak-ops-ui/yarn.lock

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Check release metadata
        run: ./scripts/release/check-release-metadata.sh

      - name: Normalize release version
        run: ./scripts/release/prepare-release-version.sh

      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: yak-ops-ui
        run: yarn build

      - name: Build distribution
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Create checksums
        run: sha256sum yak-ops-dist/target/yak-ops-*.tar.gz > SHA256SUMS

      - name: Set build metadata
        id: build_meta
        shell: bash
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: backend-runtime
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/yak-ops-api:${{ env.YAK_OPS_VERSION }}
            ${{ env.DOCKERHUB_NAMESPACE }}/yak-ops-api:latest
          build-args: |
            VERSION=${{ env.YAK_OPS_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frontend-runtime
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/yak-ops:${{ env.YAK_OPS_VERSION }}
            ${{ env.DOCKERHUB_NAMESPACE }}/yak-ops:latest
          build-args: |
            VERSION=${{ env.YAK_OPS_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            yak-ops-dist/target/yak-ops-*.tar.gz \
            SHA256SUMS \
            --title "Yak Ops $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
