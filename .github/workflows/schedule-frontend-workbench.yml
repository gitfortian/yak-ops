name: Schedule Frontend Workbench
on:
  push:
    branches: [feat/task-schedule-frontend-integration]
    paths: [.github/workflows/schedule-frontend-workbench.yml]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/task-schedule-frontend-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply hash-verified implementation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          parts = []
          for index, sha in enumerate(['dd07c7c24822c315697bd1088d7e345d39aee69e', '2b598a4443753b245409c34c52f791f4b6f0aafb', '70436f8135b74330646fb0c03dcb366cd39ca846', '05858faaef3c4100b3f7894e070ffe1de14c5f1c']):
              blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/weifuwan/yak-ops/git/blobs/' + sha]))
              part = base64.b64decode(blob['content']).decode()
              if index == 0:
                  part = part.replace('OF6WGX/t', 'OF6W/t').replace('j5fefPX', 'j5fPX')
              if index == 2:
                  part = part.replace('HfUFMoi', 'HfUFfMoi').replace('Gyp2fa31r9', 'Gyp2dpza31r9')
              parts.append(part)
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '58f2831d4a91df777c6f83505e0c4f8674f5f886c66075f8c267892b6d73c283'
          Path('/tmp/schedule-implementation.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/schedule-implementation.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/schedule-implementation.patch'], check=True)
          PY
      - name: Format touched code
        run: |
          test_path=yak-ops-business/yak-ops-business-schedule/src/test/java/io/yak/ops/business/schedule/impl/ScheduleServiceTest.java
          format_path=yak-ops-business/yak-ops-business-schedule/src/main/java/ScheduleServiceTest.java
          cp "$test_path" "$format_path"
          bash mvnw -B -ntp -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          mv "$format_path" "$test_path"
          python3 -m pip install black==25.1.0
          python3 -m black scripts/acceptance/task_schedule_browser.py scripts/acceptance/task_schedule_ui_test.py
          python3 -m py_compile scripts/acceptance/task-execution-e2e.py scripts/acceptance/task_schedule_browser.py scripts/acceptance/task_schedule_ui_test.py
      - name: Verify frontend
        working-directory: yak-ops-ui
        run: |
          npm ci
          npm run check
          npm run build
      - name: Verify schedule business tests
        run: bash mvnw -B -ntp -pl yak-ops-business/yak-ops-business-schedule -am -Dtest=ScheduleServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Commit verified source on feature branch
        run: |
          git diff --check
          git add scripts/acceptance yak-ops-business yak-ops-common yak-ops-dao yak-ops-ui
          git diff --cached --name-only | tee /tmp/schedule-changed-files.txt
          if git diff --cached --name-only | grep '^.github/'; then exit 1; fi
          git config user.name 'weifuwan'
          git config user.email '78582861+weifuwan@users.noreply.github.com'
          git commit -m 'feat(schedule): restore task scheduling UI and integrate platform APIs'
          git push origin HEAD:feat/task-schedule-frontend-integration
          git rev-parse HEAD
      - name: Export exact verified source
        if: always()
        run: |
          git diff HEAD > /tmp/workbench-uncommitted.patch
          git archive --format=tar HEAD | gzip > /tmp/schedule-verified-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-verified-source
          path: |
            /tmp/schedule-verified-source.tar.gz
            /tmp/workbench-uncommitted.patch
            /tmp/schedule-changed-files.txt
          retention-days: 1
