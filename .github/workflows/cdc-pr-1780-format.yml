name: Temporary CDC PR 1780 Format
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 1780 && github.event.pull_request.head.repo.full_name == 'weifuwan/yak-ops' && github.event.pull_request.head.ref == 'refactor/mysql-cdc-unified-runtime' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Java formatter to MySQL CDC module
        run: bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yak-flow/yak-flow-connector-cdc-mysql
          if ! git diff --cached --quiet; then
            git commit -m "style(cdc): apply Spotless to unified runtime"
            git push origin HEAD:refs/heads/refactor/mysql-cdc-unified-runtime
          fi
