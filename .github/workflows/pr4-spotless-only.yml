name: PR4 Spotless Only

on:
  push:
    branches:
      - feat/data-sync-schema-planning-preview-20261023

permissions:
  contents: read

concurrency:
  group: pr4-spotless-only
  cancel-in-progress: true

jobs:
  spotless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless (no tests or compilation)
        run: bash mvnw -B -ntp -pl yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync,yak-ops-boot com.diffplug.spotless:spotless-maven-plugin:3.10.2:check
