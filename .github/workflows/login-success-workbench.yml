name: Login Success Workbench
on:
  push:
    branches: [codex/login-success-authored-pose-historical-alignment]
    paths:
      - .github/workflows/login-success-workbench.yml
      - .github/login-success.patch
permissions:
  contents: read
concurrency:
  group: login-success-workbench
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'weifuwan/yak-ops' && github.ref == 'refs/heads/codex/login-success-authored-pose-historical-alignment'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/login-success-authored-pose-historical-alignment
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - run: npm ci
        working-directory: yak-ops-ui
      - name: Apply checksum-verified source edits
        if: hashFiles('.github/login-success.patch') != ''
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path, PurePosixPath
          header, count = Path('.github/login-success.patch').read_text().splitlines()
          assert int(count) == 7
          encoded = ''.join(Path(f'.github/login-success-patch.{i}').read_text() for i in range(int(count)))
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert 'sha256:' + hashlib.sha256(raw).hexdigest() == header
          digest = lambda text: hashlib.sha256(text.encode()).hexdigest()
          pending = []
          for item in json.loads(raw):
              for value in (item['path'], item['base']):
                  if value is not None:
                      assert value.startswith('yak-ops-ui/') and '..' not in PurePosixPath(value).parts
              original = Path(item['base']).read_text() if item['base'] else ''
              assert digest(original) == item['base_sha256'], item['path']
              lines = original.splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  lines[start:end] = replacement
              result = ''.join(lines)
              assert digest(result) == item['sha256'], item['path']
              pending.append((Path(item['path']), result))
          for path, result in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(result)
          print(f'Applied {len(pending)} verified source files')
          PY
      - name: Format touched source
        if: hashFiles('.github/login-success.patch') != ''
        working-directory: yak-ops-ui
        run: |
          git diff --name-only -- '*.ts' '*.tsx' '*.css' '*.mjs' '*.md' | sed 's|^yak-ops-ui/||' | while IFS= read -r path; do
            test ! -f "$path" || npx --no-install oxfmt "$path"
          done
      - name: Format check
        if: hashFiles('.github/login-success.patch') != ''
        working-directory: yak-ops-ui
        run: npm run format:check
      - name: Lint
        if: hashFiles('.github/login-success.patch') != ''
        working-directory: yak-ops-ui
        run: npm run lint
      - name: Types
        if: hashFiles('.github/login-success.patch') != ''
        working-directory: yak-ops-ui
        run: npm run typecheck
      - name: Architecture
        if: hashFiles('.github/login-success.patch') != ''
        working-directory: yak-ops-ui
        run: npm run architecture:check
      - name: Geometry regression
        if: hashFiles('.github/login-success.patch') != ''
        working-directory: yak-ops-ui
        run: node scripts/verify-login-failure-transition.mjs && node scripts/verify-login-success-transition.mjs
      - name: Production build
        if: hashFiles('.github/login-success.patch') != ''
        working-directory: yak-ops-ui
        run: npm run build
      - name: Publish verified implementation on the isolated branch
        if: success() && hashFiles('.github/login-success.patch') != ''
        run: |
          test "$(git branch --show-current)" = codex/login-success-authored-pose-historical-alignment
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/login-success.patch .github/login-success-patch.[0-6]
          git add yak-ops-ui
          git commit -m 'feat(ui): align authored login success poses with historical expressions'
          git push origin HEAD:codex/login-success-authored-pose-historical-alignment
