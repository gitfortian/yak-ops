name: Schedule Merge Review Workbench
on:
  push:
    branches: [feat/task-schedule-frontend-integration]
    paths: [.github/workflows/schedule-review-workbench.yml]
permissions:
  contents: write
jobs:
  merge-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Reproduce reviewed merge and fixture correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name weifuwan
          git config user.email 78582861+weifuwan@users.noreply.github.com
          if git merge --no-commit --no-ff 653c2cdd9c53ed2e812acb5df6364a24b441892c; then
            :
          else
            test "$(git diff --name-only --diff-filter=U)" = 'yak-ops-ui/apps/web/app/offline-sync/index.tsx'
            python3 - <<'PY'
          from pathlib import Path
          p = Path('yak-ops-ui/apps/web/app/offline-sync/index.tsx')
          s = p.read_text()
          start = s.index('<<<<<<< HEAD')
          end = s.index('\n', s.index('>>>>>>> ', start))
          s = s[:start] + 'import { ArrowRight, Database, Plus } from "lucide-react";\nimport { useCallback, useEffect, useMemo, useRef, useState } from "react";' + s[end:]
          p.write_text(s)
          PY
            git add yak-ops-ui/apps/web/app/offline-sync/index.tsx
          fi
          gh api repos/weifuwan/yak-ops/git/blobs/8326e1f1b41a82959211802104f5e34d5cc31b03 --jq .content | base64 --decode > /tmp/schedule-review.patch
          test "$(git hash-object /tmp/schedule-review.patch)" = '8326e1f1b41a82959211802104f5e34d5cc31b03'
          git apply --check /tmp/schedule-review.patch
          git apply /tmp/schedule-review.patch
          git add scripts/acceptance/task_schedule_ui_test.py
          git rm .github/workflows/schedule-review-workbench.yml
          test "$(git write-tree)" = '5df642f715096cebfa456f56b697ac69262a834f'
          git restore --source=HEAD --staged --worktree -- .github/workflows/schedule-review-workbench.yml
          git diff --cached --check
          python3 -m py_compile scripts/acceptance/task_schedule_ui_test.py scripts/acceptance/task_schedule_browser.py scripts/acceptance/task-execution-e2e.py
      - name: Verify merged frontend
        working-directory: yak-ops-ui
        run: |
          npm ci
          npm run check
          npm run build
      - name: Publish reviewed merge on the feature branch
        run: |
          git commit -m 'Merge main and align schedule browser acceptance with execution summaries'
          git push origin HEAD:refs/heads/feat/task-schedule-frontend-integration
