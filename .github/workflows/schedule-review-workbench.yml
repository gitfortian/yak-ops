name: Schedule Merge Review Workbench
on:
  push:
    branches: [feat/task-schedule-frontend-integration]
    paths: [.github/workflows/schedule-review-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export Git objects for offline merge review
        run: |
          git rev-parse HEAD refs/remotes/origin/main > /tmp/schedule-review-refs.txt
          git bundle create /tmp/schedule-review.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-merge-review-snapshot
          path: |
            /tmp/schedule-review.bundle
            /tmp/schedule-review-refs.txt
          retention-days: 1
          compression-level: 0
