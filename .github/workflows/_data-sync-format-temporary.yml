name: Data Sync Temporary Formatter
on:
  push:
    branches:
      - refactor/data-sync-config-validation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format DATA_SYNC sources and emit the resulting text for review
        shell: bash
        run: |
          mvn -B -ntp -pl yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply -DskipTests
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          for file in changed:
              if "yak-ops-plugin-task-data-sync/src/main/java/" in file and file.endswith(".java"):
                  text = Path(file).read_text(encoding="utf-8")
                  print("FORMATJSON " + json.dumps({"path": file, "content": text}, ensure_ascii=True, separators=(",", ":")))
          PY
