name: Nightly Backend Acceptance

on:
  schedule:
    # 02:00 Asia/Singapore (18:00 UTC); scheduled runs use default branch.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A separate full matrix does not weaken PR or Release Gate requirements.
# Unrelated scheduled/manual runs must not cancel one another.
concurrency:
  group: nightly-backend-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  full-backend-acceptance:
    name: Full Backend Acceptance
    uses: ./.github/workflows/backend-tests.yml
    with:
      suite: full
