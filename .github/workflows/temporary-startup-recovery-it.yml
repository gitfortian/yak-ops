name: Temporary Specific Startup Recovery IT
# Third pass: retain assigned stream-only Binlog split
on:
  push:
    branches: [feat/mysql-cdc-chunk-startup-completion]
    paths: [.github/workflows/temporary-startup-recovery-it.yml]

permissions:
  contents: read

jobs:
  mysql-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mysql-cdc-chunk-startup-completion
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run targeted real MySQL startup mode acceptance
        run: |
          bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql -am -Pintegration-tests \
            -Dbackend.test.groups=cdc -Dit.test=MySqlStartupModesIT \
            -Dfailsafe.failIfNoSpecifiedTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dspotless.check.skip=true -Dcheckstyle.skip=true verify
