name: CDC One-time Spotless Formatting

on:
  pull_request:
    paths:
      - '.github/workflows/cdc-one-time-format.yml'

permissions:
  contents: write

jobs:
  format-cdc:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/flink-cdc-mysql-suite-replacement'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Spotless rules to impacted Java modules
        run: >
          bash mvnw -B -ntp -pl yak-ops-core,yak-flow/yak-flow-connector-cdc-mysql -am
          com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Commit mechanical formatting changes on this PR branch only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "test/flink-cdc-mysql-suite-replacement"
          if test -n "$(git status --porcelain)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- '*.java'
            if ! git diff --cached --quiet; then
              git commit -m "style(cdc): apply repository Spotless rules to CDC reactor"
              git push origin "HEAD:${GITHUB_HEAD_REF}"
            fi
          fi
