name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Yak Ops
        uses: actions/checkout@v4

      - name: Load release metadata
        shell: bash
        run: |
          set -a
          source release.env
          set +a
          grep -E '^[A-Z0-9_]+=' release.env >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Checkout pinned Yak Framework
        uses: actions/checkout@v4
        with:
          repository: weifuwan/yak-framework
          ref: ${{ env.YAK_FRAMEWORK_REF }}
          path: .deps/yak-framework

      - name: Install pinned Yak Framework
        working-directory: .deps/yak-framework
        run: mvn -B -ntp -DskipTests install

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yak-ops-ui/yarn.lock

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Check release metadata
        run: ./scripts/release/check-release-metadata.sh

      - name: Normalize release version
        run: ./scripts/release/prepare-release-version.sh

      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: yak-ops-ui
        run: yarn build

      - name: Package Yak Ops
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: yak-ops-${{ env.YAK_OPS_VERSION }}
          path: yak-ops-dist/target/yak-ops-*.tar.gz
          if-no-files-found: error
          retention-days: 7
