name: Execution View Browser Acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    if: github.head_ref == 'feat/data-sync-execution-status-visualization'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: yak-ops-ui
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install CJK fonts for visual inspection
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk > /dev/null
      - name: Verify production page with explicit service fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = subprocess.check_output(['git', 'show', '36b29fb1e2e17129e8fa36073bd4c5f788a405af:.github/workflows/data-sync-view-acceptance-1629.yml'], text=True)
          block = source.split('      run: |\n', 1)[1].split('    - uses: actions/upload-artifact@v4', 1)[0]
          script = '\n'.join(line[8:] for line in block.splitlines())
          script = script.replace('const value=await bar.getAttribute("aria-valuenow");', 'const value=await bar.getAttribute("aria-valuenow"); assert.equal(await page.getByRole("tab",{name:"执行状态"}).evaluate(node=>getComputedStyle(node).color),"rgb(51, 93, 255)");')
          Path('/tmp/execution-view-test.sh').write_text(script)
          PY
          bash /tmp/execution-view-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-view-browser
          path: |
            /tmp/execution-view-artifacts
            /tmp/execution-view-dist
          retention-days: 7
