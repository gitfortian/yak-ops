name: Temporary MySQL CDC Spotless Apply
on:
  push:
    branches:
      - fix/mysql-cdc-debezium-recovery-alignment
    paths:
      - .github/workflows/temporary-cdc-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'weifuwan/yak-ops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: fix/mysql-cdc-debezium-recovery-alignment
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Spotless formatting (MySQL CDC module only)
        run: bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Commit mechanically formatted files on this PR branch only
        run: |
          set -euo pipefail
          git add yak-flow/yak-flow-connector-cdc-mysql/src/main/java
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(cdc): apply repository Palantir Java Format to MySQL CDC module'
            git push origin HEAD:refs/heads/fix/mysql-cdc-debezium-recovery-alignment
          fi
