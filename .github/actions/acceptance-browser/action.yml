name: Prepare acceptance browser
description: Install the pinned browser toolchain and start the frontend for acceptance.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '22.13'
        cache: npm
        cache-dependency-path: yak-ops-ui/package-lock.json
    - name: Install browser acceptance dependencies
      shell: bash
      run: |
        npm ci --prefix yak-ops-ui --prefer-offline --no-audit --no-fund
        python3 -m pip install playwright==1.57.0
        python3 -m playwright install --with-deps chromium
    - name: Start frontend
      shell: bash
      env:
        YAK_BACKEND_URL: http://127.0.0.1:18080
      run: |
        (cd yak-ops-ui && npm run dev -- --port 5173 --strictPort) > /tmp/yak-schedule-vite.log 2>&1 &
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
          sleep 1
        done
        cat /tmp/yak-schedule-vite.log
        exit 1
